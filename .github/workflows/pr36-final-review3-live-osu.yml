name: PR36 final review 3 - live osu identity

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-final-review3-live-osu.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm current-main ancestry
        run: |
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          echo "main=$(git rev-parse origin/main)"
          echo "head=$(git rev-parse HEAD)"
      - name: Re-fetch all 356 rows from API and public page
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations
          import time
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.http import get_text
          from touhou_osu.osu_api import OsuApi, entry_from_osu
          from touhou_osu.sources import parse_beatmapset_page

          base=Catalog.load(Path('/tmp/pr36-base/data/catalog'))
          cur=Catalog.load(Path('data/catalog'))
          ids=sorted(set(cur.entries)-set(base.entries))
          assert len(ids)==356, len(ids)
          api=OsuApi.from_env(); api.token()
          failures=[]
          fields=('beatmapset_id','artist','title','creator','source','status','osu_last_updated')

          def public_entry(bid,evidence):
              last=None
              for attempt in range(5):
                  try:
                      raw=parse_beatmapset_page(get_text(f'https://osu.ppy.sh/beatmapsets/{bid}'))
                      return entry_from_osu(raw,evidence=evidence,confidence='candidate')
                  except Exception as exc:
                      last=exc
                      if attempt<4: time.sleep(5*(attempt+1))
              raise RuntimeError(f'public page failed after retries: {last}')

          for n,bid in enumerate(ids,1):
              stored=cur.entries[bid]
              try:
                  raw=api.beatmapset(bid)
                  fresh=entry_from_osu(raw,evidence=stored.evidence,confidence='candidate')
                  if int(raw.get('id',-1))!=bid: raise RuntimeError('API ID mismatch')
                  mismatch=[f for f in fields if getattr(stored,f)!=getattr(fresh,f)]
                  if sorted(stored.modes)!=sorted(fresh.modes): mismatch.append('modes')
                  if mismatch: raise RuntimeError('catalog/API drift: '+', '.join(mismatch))
                  page=public_entry(bid,stored.evidence)
                  mismatch=[f for f in fields if getattr(fresh,f)!=getattr(page,f)]
                  if sorted(fresh.modes)!=sorted(page.modes): mismatch.append('modes')
                  if mismatch: raise RuntimeError('API/public-page mismatch: '+', '.join(mismatch))
              except Exception as exc:
                  failures.append((bid,str(exc)))
              time.sleep(0.35)
              if n%50==0: print(f'checked={n}/356 failures={len(failures)}')
          assert not failures, f'live identity failures: {failures[:30]}'
          print('FINAL REVIEW 3 PASS')
          print('live_api_and_public_page_exact=356/356')
          PY
      - name: Final standard validation
        run: |
          make check
          make build
          git diff --check origin/main...HEAD
