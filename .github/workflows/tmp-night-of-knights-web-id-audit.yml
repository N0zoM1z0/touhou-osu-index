name: Temporary Night of Knights web-discovered ID audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Direct-refetch web-discovered Night of Knights sets
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.osu_api import OsuApi,entry_from_osu

          IDS=[2411873,2350651,2353410,853077,1289966,1284117,1996092,1913530,1370239,2255745,2410887,2193728,436838,2366473,1237255,2276093,1241561,2223639,1547092,2384947,1069858,167410]
          api=OsuApi.from_env();api.token();catalog=Catalog.load(Path('data/catalog.json'))
          def f(i):
              try:r=api.beatmapset(i)
              except Exception as exc:return {'beatmapset_id':i,'error':f'{type(exc).__name__}:{exc}'}
              e=entry_from_osu(r,evidence=['audit:night-of-knights-web'],confidence='candidate')
              cur=catalog.entries.get(i)
              return {
                'beatmapset_id':i,'catalog_state':'absent' if cur is None else cur.confidence,
                'catalog_evidence':[] if cur is None else cur.evidence,
                'artist':e.artist,'artist_unicode':r.get('artist_unicode',''),'title':e.title,'title_unicode':r.get('title_unicode',''),
                'creator':e.creator,'source':e.source,'status':e.status,'modes':e.modes,
                'classifier_confidence':e.confidence,'explicit_touhou_source':is_explicit_touhou_source(e.source),
                'tags':r.get('tags',''),'last_updated':r.get('last_updated')
              }
          with ThreadPoolExecutor(max_workers=8) as p:rows=list(p.map(f,IDS))
          print('NIGHT_WEB_ID_AUDIT_BEGIN')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          print('NIGHT_WEB_ID_AUDIT_END')
          PY
