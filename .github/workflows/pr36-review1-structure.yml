name: PR36 review 1 - structural audit

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-review1-structure.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct base and verify every catalog invariant
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations

          import collections
          import re
          import subprocess
          import unicodedata
          from pathlib import Path

          from touhou_osu.catalog import Catalog

          EXPECTED_BASE = 4438
          EXPECTED_NEW = 356
          EXPECTED_FINAL = 4794
          EXPECTED_STATUS = {"graveyard": 352, "ranked": 1, "wip": 3}
          EXPECTED_CLASS = {"bad_apple": 230, "zun_original": 126}
          REVIEW_DATE = "2026-09-06"
          AUDIT = Path("docs/source-audit-2026-09-wave3-deep-coverage.md")

          ZUN_THEME_GAMES = {
              "U.N.オーエンは彼女なのか？": "東方紅魔郷 ～ the Embodiment of Scarlet Devil.",
              "亡き王女の為のセプテット": "東方紅魔郷 ～ the Embodiment of Scarlet Devil.",
              "恋色マスタースパーク": "東方永夜抄 ～ Imperishable Night.",
              "ネクロファンタジア": "東方妖々夢 ～ Perfect Cherry Blossom.",
              "おてんば恋娘": "東方紅魔郷 ～ the Embodiment of Scarlet Devil.",
              "ハルトマンの妖怪少女": "東方地霊殿 ～ Subterranean Animism.",
              "月まで届け、不死の煙": "東方永夜抄 ～ Imperishable Night.",
          }
          BAD_GAME = "東方幻想郷 ～ Lotus Land Story"

          def compact(value: str) -> str:
              value = unicodedata.normalize("NFKC", str(value)).casefold()
              return "".join(ch for ch in value if ch.isalnum())

          base = Catalog.load(Path("/tmp/pr36-base/data/catalog"))
          cur = Catalog.load(Path("data/catalog"))
          assert len(base.entries) == EXPECTED_BASE, len(base.entries)
          assert len(cur.entries) == EXPECTED_FINAL, len(cur.entries)

          base_ids = set(base.entries)
          cur_ids = set(cur.entries)
          assert not (base_ids - cur_ids), "PR deleted base IDs"
          new_ids = sorted(cur_ids - base_ids)
          assert len(new_ids) == EXPECTED_NEW, len(new_ids)

          # Strongest possible unchanged-row invariant: serialization equality.
          changed_old = []
          for bid in sorted(base_ids):
              if base.entries[bid].to_dict() != cur.entries[bid].to_dict():
                  changed_old.append(bid)
          assert not changed_old, f"pre-existing rows changed: {changed_old[:20]}"

          # PR file-level boundary: only catalog shards + permanent audit + this temporary review workflow.
          changed_files = subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines()
          unexpected = [
              path for path in changed_files
              if not path.startswith("data/catalog/")
              and path != "docs/source-audit-2026-09-wave3-deep-coverage.md"
              and path != ".github/workflows/pr36-review1-structure.yml"
          ]
          assert not unexpected, f"unexpected PR files: {unexpected}"
          numstat = subprocess.check_output(
              ["git", "diff", "--numstat", "origin/main...HEAD"], text=True
          ).splitlines()
          data_deletions = []
          for row in numstat:
              add, delete, path = row.split("\t", 2)
              if path.startswith("data/catalog/") and delete != "0":
                  data_deletions.append((path, delete))
          assert not data_deletions, f"catalog deletions present: {data_deletions}"

          class_counts = collections.Counter()
          status_counts = collections.Counter()
          ids_by_class = {"bad_apple": [], "zun_original": []}

          for bid in new_ids:
              e = cur.entries[bid]
              ev = set(e.evidence)
              assert e.confidence == "verified", (bid, e.confidence)
              assert "manual:verified" in ev, bid
              assert "audit:wave3-deep-coverage-2026-09" in ev, bid
              assert e.last_checked == REVIEW_DATE, (bid, e.last_checked)
              assert e.artist and e.title and e.creator, f"incomplete identity {bid}"
              assert len(e.origin_games) == 1, (bid, e.origin_games)
              assert len(e.original_themes) == 1, (bid, e.original_themes)
              status_counts[e.status] += 1

              theme = e.original_themes[0]
              game = e.origin_games[0]
              if theme == "Bad Apple!!":
                  cls = "bad_apple"
                  assert e.touhou_kind == "arrangement", (bid, e.touhou_kind)
                  assert game == BAD_GAME, (bid, game)
                  assert "provenance:arrangement-chronicle-bad-apple" in ev, bid
              else:
                  cls = "zun_original"
                  assert theme in ZUN_THEME_GAMES, (bid, theme)
                  assert e.touhou_kind == "original", (bid, e.touhou_kind)
                  assert game == ZUN_THEME_GAMES[theme], (bid, theme, game)
                  assert compact(e.artist) == "zun", (bid, e.artist)
                  assert "identity:zun-exact-original-title" in ev, bid
                  assert "provenance:arrangement-chronicle-original-theme" in ev, bid

              class_counts[cls] += 1
              ids_by_class[cls].append(bid)

          assert dict(class_counts) == EXPECTED_CLASS, class_counts
          assert dict(status_counts) == EXPECTED_STATUS, status_counts

          # Permanent audit table must enumerate exactly the newly written set once each.
          audit_text = AUDIT.read_text(encoding="utf-8")
          audit_ids = [
              int(m.group(1)) for line in audit_text.splitlines()
              if (m := re.match(r"^\|\s*(\d+)\s*\|", line))
          ]
          assert len(audit_ids) == EXPECTED_NEW, len(audit_ids)
          assert len(set(audit_ids)) == EXPECTED_NEW, "duplicate IDs in audit table"
          assert sorted(audit_ids) == new_ids, "audit-table IDs differ from catalog new IDs"
          for needle in (
              "final accepted after current API + public-page verification: **356**",
              "catalog after write: **4794**",
              "audit classes: bad_apple=230, zun_original=126",
              "statuses: graveyard=352, ranked=1, wip=3",
          ):
              assert needle in audit_text, f"audit summary missing: {needle}"

          print("REVIEW 1 PASS")
          print(f"base={len(base.entries)} final={len(cur.entries)} new={len(new_ids)}")
          print(f"classes={dict(class_counts)} statuses={dict(status_counts)}")
          print(f"old_rows_changed={len(changed_old)} audit_ids={len(audit_ids)}")
          PY
      - name: Validate canonical data and exports
        run: |
          make check
          make build
          git diff --check origin/main...HEAD
