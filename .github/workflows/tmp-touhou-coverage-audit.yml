name: Temporary Touhou coverage audit

on:
  pull_request:
  push:
    branches: [feat/touhou-coverage-200plus-2026-08-21]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit candidate Touhou collections against canonical catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from touhou_osu.catalog import Catalog
          from touhou_osu.sources import import_collector_collection

          sources = [
              {"id": 14846, "name": "4-Touhou Remix", "confidence": "candidate"},
              {"id": 3570, "name": "Touhou 3*", "confidence": "candidate"},
              {"id": 541, "name": "Touhou Osu Mania", "confidence": "candidate"},
              {"id": 2520, "name": "touhou", "confidence": "candidate"},
              {"id": 4499, "name": "touhou dt", "confidence": "candidate"},
              {"id": 1234, "name": "ZUN Collection Pack #1 (osu!std)", "confidence": "candidate"},
          ]

          catalog = Catalog.load(Path("data/catalog.json"))
          existing_ids = set(catalog.entries)
          union_ids = set()
          union_missing = set()
          report = []

          for source in sources:
              entries = import_collector_collection(source)
              ids = {entry.beatmapset_id for entry in entries}
              missing = ids - existing_ids
              new_to_batch = ids - union_ids
              new_missing_to_batch = missing - union_missing
              confidences = Counter(entry.confidence for entry in entries)
              report.append({
                  "id": source["id"],
                  "name": source["name"],
                  "imported_unique_beatmapsets": len(ids),
                  "already_in_catalog": len(ids & existing_ids),
                  "missing_from_catalog": len(missing),
                  "new_unique_vs_prior_audited_sources": len(new_to_batch),
                  "new_missing_vs_prior_audited_sources": len(new_missing_to_batch),
                  "confidence_counts": dict(sorted(confidences.items())),
                  "missing_ids": sorted(missing),
              })
              union_ids |= ids
              union_missing |= missing

          payload = {
              "catalog_entries": len(existing_ids),
              "sources": report,
              "union_source_beatmapsets": len(union_ids),
              "union_missing_from_catalog": len(union_missing),
              "union_missing_ids": sorted(union_missing),
          }
          print("TOUHOU_COVERAGE_AUDIT_BEGIN")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          print("TOUHOU_COVERAGE_AUDIT_END")
          PY

  discovery-backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit full configured osu API discovery backlog
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.cli import load_config
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          api = OsuApi.from_env()
          catalog = Catalog.load(Path("data/catalog.json"))
          config = load_config(Path("config/seeds.json"))
          existing = set(catalog.entries)
          raws = {}
          evidence = {}

          for query in config.get("discovery_queries", []):
              for raw in api.search(query, max_pages=4):
                  beatmapset_id = int(raw["id"])
                  raws[beatmapset_id] = raw
                  evidence.setdefault(beatmapset_id, set()).add(f"discovery_query:{query}")

          missing = []
          for beatmapset_id in sorted(set(raws) - existing):
              entry = entry_from_osu(
                  raws[beatmapset_id],
                  evidence=sorted(evidence[beatmapset_id]),
                  confidence="candidate",
              )
              missing.append(entry)

          counts = Counter(entry.confidence for entry in missing)
          accepted = [entry for entry in missing if entry.confidence in {"verified", "probable"}]
          payload = {
              "configured_queries": len(config.get("discovery_queries", [])),
              "discovered_unique": len(raws),
              "missing_from_catalog": len(missing),
              "missing_confidence_counts": dict(sorted(counts.items())),
              "accepted_missing_count": len(accepted),
              "accepted_missing": [
                  {
                      "beatmapset_id": entry.beatmapset_id,
                      "artist": entry.artist,
                      "title": entry.title,
                      "creator": entry.creator,
                      "source": entry.source,
                      "status": entry.status,
                      "modes": entry.modes,
                      "confidence": entry.confidence,
                      "evidence": entry.evidence,
                  }
                  for entry in accepted
              ],
              "candidate_missing_ids": [entry.beatmapset_id for entry in missing if entry.confidence == "candidate"],
          }
          print("DISCOVERY_BACKLOG_AUDIT_BEGIN")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          print("DISCOVERY_BACKLOG_AUDIT_END")
          PY
