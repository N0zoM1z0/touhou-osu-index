name: Temporary Touhou coverage apply

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-verified-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/touhou-coverage-200plus-2026-08-21
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-discover, direct-refetch, and add 300 verified missing beatmapsets
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -Fq '[coverage-batch]'; then
            echo 'coverage batch already applied; no-op'
            exit 0
          fi
          python - <<'PY'
          import json
          import time
          from collections import Counter, defaultdict, deque
          from pathlib import Path

          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import normalize
          from touhou_osu.cli import load_config
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          TARGET = 300
          path = Path("data/catalog.json")
          catalog = Catalog.load(path)
          before_count = len(catalog.entries)
          existing = set(catalog.entries)
          config = load_config(Path("config/seeds.json"))
          api = OsuApi.from_env()

          raws = {}
          evidence = defaultdict(set)
          for query in config.get("discovery_queries", []):
              for raw in api.search(query, max_pages=4):
                  beatmapset_id = int(raw["id"])
                  raws[beatmapset_id] = raw
                  evidence[beatmapset_id].add(f"discovery_query:{query}")

          missing = []
          for beatmapset_id in sorted(set(raws) - existing):
              entry = entry_from_osu(
                  raws[beatmapset_id],
                  evidence=sorted(evidence[beatmapset_id]),
                  confidence="candidate",
              )
              missing.append(entry)

          confidence_counts = Counter(entry.confidence for entry in missing)
          verified = [entry for entry in missing if entry.confidence == "verified"]
          if len(verified) < TARGET:
              raise SystemExit(f"only {len(verified)} verified missing beatmapsets; need {TARGET}")

          buckets = defaultdict(list)
          for entry in verified:
              buckets[normalize(entry.source)].append(entry)
          queues = {key: deque(sorted(value, key=lambda item: item.beatmapset_id)) for key, value in buckets.items()}
          ordered = []
          keys = sorted(queues)
          while True:
              progressed = False
              for key in keys:
                  if queues[key]:
                      ordered.append(queues[key].popleft())
                      progressed = True
              if not progressed:
                  break

          selected = []
          rejected_after_refetch = []
          for candidate in ordered:
              direct_raw = api.beatmapset(candidate.beatmapset_id)
              if int(direct_raw.get("id", -1)) != candidate.beatmapset_id:
                  rejected_after_refetch.append({"beatmapset_id": candidate.beatmapset_id, "reason": "id_mismatch"})
                  continue
              direct = entry_from_osu(
                  direct_raw,
                  evidence=sorted(evidence[candidate.beatmapset_id]),
                  confidence="candidate",
              )
              if direct.confidence != "verified":
                  rejected_after_refetch.append(
                      {
                          "beatmapset_id": candidate.beatmapset_id,
                          "reason": "not_verified_after_direct_refetch",
                          "source": direct.source,
                          "confidence": direct.confidence,
                      }
                  )
                  continue
              catalog.merge(direct)
              selected.append(direct)
              if len(selected) >= TARGET:
                  break
              time.sleep(0.03)

          if len(selected) != TARGET:
              raise SystemExit(f"only {len(selected)} survived direct refetch; need {TARGET}")

          catalog.save(path)
          source_counts = Counter(normalize(entry.source) for entry in selected)
          status_counts = Counter(entry.status for entry in selected)
          mode_counts = Counter(mode for entry in selected for mode in entry.modes)
          query_hit_counts = Counter(len(evidence[entry.beatmapset_id]) for entry in selected)
          report = {
              "catalog_before": before_count,
              "catalog_after": len(catalog.entries),
              "configured_queries": len(config.get("discovery_queries", [])),
              "search_unique": len(raws),
              "missing_from_catalog": len(missing),
              "missing_confidence_counts": dict(sorted(confidence_counts.items())),
              "verified_backlog_before_batch": len(verified),
              "target": TARGET,
              "selected_after_direct_refetch": len(selected),
              "rejected_after_direct_refetch": rejected_after_refetch,
              "unique_normalized_sources_in_batch": len(source_counts),
              "top_source_counts": source_counts.most_common(20),
              "status_counts": dict(sorted(status_counts.items())),
              "mode_counts": dict(sorted(mode_counts.items())),
              "discovery_query_hit_count_distribution": dict(sorted(query_hit_counts.items())),
              "selected_ids": [entry.beatmapset_id for entry in selected],
          }
          print("VERIFIED_BATCH_REPORT_BEGIN")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("VERIFIED_BATCH_REPORT_END")
          PY
          python -m touhou_osu.cli validate
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "data: add 300 verified Touhou beatmapsets [coverage-batch]"
          git push origin HEAD:feat/touhou-coverage-200plus-2026-08-21
