name: Wave 3 Boundary Diagnostic

on:
  push:
    branches: [feat/official-packs-wave3-scan]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge current main-equivalent sources and print boundary evidence
        run: |
          python3 -m touhou_osu import-seeds --write
          python3 - <<'PY'
          import json
          data = json.load(open('data/catalog.json', encoding='utf-8'))
          for target in (495283, 4135, 605290):
              item = next(x for x in data['entries'] if int(x['beatmapset_id']) == target)
              print(target, json.dumps({
                  'artist': item.get('artist'),
                  'title': item.get('title'),
                  'source': item.get('source'),
                  'confidence': item.get('confidence'),
                  'evidence': item.get('evidence'),
              }, ensure_ascii=False, sort_keys=True))
          PY
