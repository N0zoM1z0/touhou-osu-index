name: Temporary source-review corrections

on:
  push:
    branches:
      - work/status-depth-wave2-2026-09-14

permissions:
  contents: write

jobs:
  correct-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: work/status-depth-wave2-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply manual source-review boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          from touhou_osu.catalog import Catalog

          catalog = Catalog.load(Path('data/catalog'))
          decisions = {
              2606790: ('excluded', 'manual:excluded'),
              2473015: ('candidate', 'manual:candidate'),
              2612960: ('candidate', 'manual:candidate'),
          }
          for beatmapset_id, (confidence, marker) in decisions.items():
              entry = catalog.entries[beatmapset_id]
              entry.evidence = sorted(
                  set(entry.evidence) | {marker, 'review:source-pass2-2026-09-14'},
                  key=str.casefold,
              )
              entry.confidence = confidence
              entry.last_checked = '2026-09-14'
          catalog.save_shards(Path('data/catalog'))

          audit_path = Path('docs/source-audit-2026-09-status-depth-wave2.md')
          audit = audit_path.read_text(encoding='utf-8')
          audit = audit.replace(
              '- final accepted rows: **250**',
              '- final tracked additions before manual post-review: **250**',
          )
          marker = '## Manual source review — pass 2'
          if marker not in audit:
              audit += '''\n\n## Manual source review — pass 2\n\nA second, independent source-focused review treated every external-provenance `unknown` row as a manual review target, with priority on non-obvious artists/titles, fan-game-looking source strings, covers/memes, and prior review-history rows. Three sticky boundary corrections were required:\n\n- `2606790` — **Everyone from the Red Cucumber thread — Kappa-sama no Iu Toori ~ One-way Accelerator**: changed `verified → excluded` with `manual:excluded`. `Subterranean Hatred` is an unofficial fan-made Phantasm stage for Subterranean Animism, and this theme belongs to the fan-made Mitori project rather than a ZUN/Touhou official composition chain. Review references: https://moriyashrine.org/resources/subterranean-hatred.389/ and https://w.atwiki.jp/toho/pages/6454.html\n- `2473015` — **Matsubame Frame — The Waltz of the Night**: changed `verified → candidate` with `manual:candidate`. This ID was already withheld by the preceding status-depth audit after an unstable live identity; the current identity is now stable, but repeated exact artist/title searches still did not establish an independent Touhou composition relation. The current osu! game-source string is retained as discovery evidence, not treated as sufficient for a sticky manual verification.\n- `2612960` — **7_7 — Bitch Gun**: changed `verified → candidate` with `manual:candidate`. Exact artist/title searches reproduce the track and osu! mappings but did not establish a credible Touhou composition relation; the source field is retained as a discovery signal only.\n\nPost-review confidence for the 250 newly tracked rows is therefore **247 verified / 2 candidate / 1 excluded**. This remains well above the requested 200 high-confidence additions while preserving the questionable boundaries for future evidence instead of silently dropping them.\n'''
          audit_path.write_text(audit, encoding='utf-8')

          validation_path = Path('docs/source-audit-2026-09-status-depth-wave2-validation.md')
          validation = validation_path.read_text(encoding='utf-8')
          validation = validation.replace(
              'catalog validation: **5,294 total** (`3,690 verified`, `29 probable`, `1,573 candidate`, `2 excluded`)',
              'catalog validation before manual pass-2 corrections: **5,294 total** (`3,690 verified`, `29 probable`, `1,573 candidate`, `2 excluded`)',
          )
          vmarker = '## Manual source review correction run'
          if vmarker not in validation:
              validation += '''\n\n## Manual source review correction run\n\nThe independent source-focused pass found one fan-game original false positive and two rows without enough corroboration for sticky verification. The catalog was corrected to `247 verified / 2 candidate / 1 excluded` among this PR's 250 new rows, using `manual:excluded` / `manual:candidate` so automated refreshes cannot undo the reviewed boundary. The corrected tree was then subjected to the same full validation and Deep Review contract again.\n'''
          validation_path.write_text(validation, encoding='utf-8')
          PY
      - name: Validate corrected tree
        run: |
          git diff --check
          make check
          make build
      - name: Structural review corrected 250-row boundary
        run: |
          git fetch origin main
          BASE=origin/main \
          MODE=structural \
          SCOPE=added \
          WORKERS=1 \
          AUDIT_DOC=docs/source-audit-2026-09-status-depth-wave2.md \
          EXPECTED_ADDITIONS=250 \
          FORBID_EXISTING_CHANGES=1 \
          REQUIRE_BASE_ANCESTOR=1 \
          AUDIT_OUTPUT=/tmp/review-pass2-structural.json \
          make audit-pr
      - name: Provenance review corrected 250-row boundary
        run: |
          python -m touhou_osu.pr_audit \
            --base-ref origin/main \
            --mode provenance \
            --scope added \
            --workers 4 \
            --require-base-ancestor \
            --output /tmp/review-pass2-provenance.json
      - name: Slow live osu identity review for all 250 additions
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.pr_audit import catalog_diff, live_osu_audit, load_catalog_at, revision_context

          repository = Path('.').resolve()
          context = revision_context(repository, 'origin/main')
          if not context.base_is_ancestor:
              raise SystemExit('origin/main is not an ancestor of HEAD')
          current = Catalog.load(repository / 'data/catalog')
          base = load_catalog_at(repository, context.merge_base, Path('data/catalog'))
          diff = catalog_diff(base, current)
          if len(diff['added']) != 250 or diff['modified'] or diff['removed']:
              raise SystemExit(f"unexpected semantic diff: {diff}")
          report = live_osu_audit(
              current,
              diff,
              scope='added',
              workers=2,
              public_interval=2.0,
              rate_limit_backoff=60.0,
          )
          Path('/tmp/review-pass2-live.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['errors'] or report['failures'] or report['checked'] != 250:
              raise SystemExit(1)
          PY
      - name: Commit permanent corrections only
        env:
          BRANCH: work/status-depth-wave2-2026-09-14
        run: |
          rm .github/workflows/review-pass2-corrections-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'review: correct three source-confidence boundaries'
          git push origin HEAD:"$BRANCH"
