name: PR26 Review 3 - search reproducibility and regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild 191-tuple search and rediscover all reviewed IDs
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, unicodedata
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from touhou_osu.osu_api import OsuApi

          EXPECTED={2626,5346,507416,2188045,2205747,2209334,2282709,2314117,2561367,21098,47754,171239,183267,427407,723024,855735}
          def table_pairs(path):
              out=[]
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  m=re.match(r'^\| `(.+?)` \| `(.+?)` \|$',line)
                  if m: out.append(m.groups())
              return out
          p1=table_pairs('docs/source-audit-2026-08-lunatic-princess.md')
          p2=table_pairs('docs/source-audit-2026-08-lunatic-princess-results.md')
          assert len(p1)==103, len(p1)
          assert len(p2)==88, len(p2)
          corpus=[]; seen=set()
          for title,guard in p1+p2:
              guard=None if guard.startswith('none;') else guard
              pair=(title,guard)
              if pair not in seen: seen.add(pair); corpus.append(pair)
          assert len(corpus)==191, len(corpus)

          def norm(v): return ''.join(ch for ch in unicodedata.normalize('NFKC',v or '').casefold() if ch.isalnum())
          def artist_ok(actual,guard):
              if not guard: return True
              a,g=norm(actual),norm(guard)
              return bool(a and g and (a in g or g in a))
          direct_prefixes=[norm('竹取飛翔'),norm('Taketori Hishou'),norm('Flight of the Bamboo Cutter')]
          help_prefix=norm('Help me, ERINNNNNN!!')
          tsuru=norm('Tsurupettan')
          def matches(artist,title):
              a,t=norm(artist),norm(title); found=[]
              for expected,guard in corpus:
                  if t==norm(expected) and artist_ok(artist,guard): found.append((expected,guard))
              if any(t.startswith(p) for p in direct_prefixes): found.append(('original-alias',None))
              if t.startswith(help_prefix): found.append(('help-family',None))
              if t.startswith(tsuru) and norm('silver forest') in a: found.append(('tsurupettan', 'Silver Forest'))
              return found

          generic={norm(x) for x in ['Lunatic Princess','Moonlit Night','Sign','SINK','sola','Crazy Diamond','Entrance to Moon','devastator','Dreaming Moon','Moonlight','HOPE','Paladin','Re:story','Lunatic Dance','Guilty Princess','Never Die','本当','かごめ','永','quiet night','No return','Resurrection','Dream Fragment','Bamboo Princess','Order To Thumbs Up','Road to the sky']}
          queries=[]; seenq=set()
          for title,guard in corpus:
              q=f'{guard} {title}' if guard and (norm(title) in generic or len(norm(title))<7) else title
              if q not in seenq: seenq.add(q); queries.append(q)
          for q in ['竹取飛翔','Taketori Hishou','Flight of the Bamboo Cutter','Help me, ERINNNNNN!!','Silver Forest Tsurupettan']:
              if q not in seenq: seenq.add(q); queries.append(q)
          assert len(queries)==194, len(queries)

          api=OsuApi.from_env(); api.token()
          discovered={}; qhits=defaultdict(set)
          def search(q): return q,list(api.search(q,max_pages=1))
          with ThreadPoolExecutor(max_workers=8) as pool:
              fs=[pool.submit(search,q) for q in queries]
              for f in as_completed(fs):
                  q,rows=f.result()
                  for raw in rows:
                      i=int(raw['id']); discovered[i]=raw; qhits[i].add(q)
          preliminary={i:raw for i,raw in discovered.items() if matches(raw.get('artist',''),raw.get('title',''))}

          def refetch(item):
              i,search_raw=item
              raw=api.beatmapset(i)
              assert int(raw['id'])==i
              assert raw.get('artist','')==search_raw.get('artist',''), (i,'artist')
              assert raw.get('title','')==search_raw.get('title',''), (i,'title')
              return i,raw
          with ThreadPoolExecutor(max_workers=8) as pool:
              direct=list(pool.map(refetch,preliminary.items()))
          source_matched={i for i,raw in direct if matches(raw.get('artist',''),raw.get('title',''))}
          missing=EXPECTED-source_matched
          assert not missing, sorted(missing)
          print('PR26_REVIEW3_REPRO_OK')
          print('corpus:',len(corpus),'queries:',len(queries),'search_hits:',len(discovered),'source_matched:',len(source_matched),'reviewed_rediscovered:',len(EXPECTED))
          PY
          make check
          rm -rf /tmp/pr26-review3-build
          python -m touhou_osu build --output /tmp/pr26-review3-build
          test -f /tmp/pr26-review3-build/index.html
          git diff --check
