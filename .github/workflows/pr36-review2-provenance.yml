name: PR36 review 2 - provenance audit

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-review2-provenance.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-audit external provenance for every new row
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations

          import collections
          import unicodedata
          import urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path

          from touhou_osu.catalog import Catalog
          from touhou_osu.http import get_json, get_text
          from touhou_osu.provenance import (
              TOUHOUDb_API,
              _song_type,
              _touhoudb_artists,
              _touhoudb_names,
              artist_matches,
              audit_entries,
          )

          CHRONICLE_BAD_APPLE = "https://touhou.arrangement-chronicle.com/original_song/%E6%9D%B1%E6%96%B9%E5%B9%BB%E6%83%B3%E9%83%B7/Bad%20Apple!!"
          CHRONICLE_STATS = "https://touhou.arrangement-chronicle.com/statistics/original_songs"
          PRIMARY_URLS = (
              "https://alst.net/arcd0056/",
              "https://alst.net/arcd0060/",
              "https://alst.net/arcd0065/",
          )
          ZUN_THEMES = {
              "U.N.オーエンは彼女なのか？": ["U.N.オーエンは彼女なのか？", "U.N.オーエンは彼女なのか", "U.N. Owen Was Her?", "U.N. Owen Was Her"],
              "亡き王女の為のセプテット": ["亡き王女の為のセプテット", "Septette for the Dead Princess"],
              "恋色マスタースパーク": ["恋色マスタースパーク", "Love-colored Master Spark", "Love Colored Master Spark", "Love-Coloured Master Spark", "Love Coloured Master Spark"],
              "ネクロファンタジア": ["ネクロファンタジア", "Necrofantasia", "Necro Fantasia"],
              "おてんば恋娘": ["おてんば恋娘", "Beloved Tomboyish Girl"],
              "ハルトマンの妖怪少女": ["ハルトマンの妖怪少女", "Hartmann's Youkai Girl", "Hartmann Youkai Girl", "Hartmanns Youkai Girl"],
              "月まで届け、不死の煙": ["月まで届け、不死の煙", "Reach for the Moon, Immortal Smoke", "Reach for the Moon Immortal Smoke", "Reach for the Moon ~ Immortal Smoke"],
          }
          OFFICIAL_TITLES = (
              "Bad Apple!! feat.nomico",
              "Bad Apple!! feat.nomico (Animelo Summer Live 2010 Edit)",
              "Bad Apple!! feat.nomico (2014 REFIX)",
              "Bad Apple!! feat.nomico (博麗神社うた祭 2016 Edit)",
              "Bad Apple!! feat.nomico (Instrumental)",
              "Bad Apple!! feat.nomico (Graphtech Remix)",
              "Bad Apple!! feat.nomico (SIMIAN NOISE REMIX)",
              "Bad Apple!! feat.nomico (REDALiCE Remix)",
              "Bad Apple!! feat.nomico (Nardis Remix)",
              "Bad Apple!! feat.nomico (Tracy vs. Astronomical Remix)",
              "Bad Apple!! feat.nomico (Nhato Remix)",
              "Bad Apple!! feat.nomico (Camellia's Bad Psy!! Remix)",
              "Bad Apple!! feat.nomico (MK Remix)",
              "Bad Apple!! feat.nomico (ZYTOKINE Remix)",
              "Bad Apple!! feat.nomico (HYPER RAVE Remix)",
              "Bad Apple!! feat.nomico (ELEMENTAS Remix)",
              "Bad Apple!! feat.nomico (COOL&CREATE Ver.)",
              "Bad Apple!! feat.nomico (豚乙女 Ver.)",
              "Bad Apple!! feat.nomico (Marasy Ver.)",
              "Bad Apple!! feat.nomico (ARM×狐夢想 Remix)",
              "Bad Apple!! feat.nomico (Marasy + Masayoshi Minoshima)",
              "Bad Apple!! feat.nomico (TOS Remix)",
          )
          OFFICIAL_PARTICIPANTS = (
              "Alstroemeria Records", "nomico", "Masayoshi Minoshima", "Camellia",
              "MK", "ZYTOKINE", "隣人", "DiGiTAL WiNG", "katsu", "Tsukasa",
              "ELEMENTAS", "A-One", "COOL&CREATE", "beatMARIO", "ビートまりお",
              "あまね", "豚乙女", "ランコ", "Marasy", "まらしぃ", "ARM", "IOSYS",
              "REDALiCE", "Nardis", "Nhato", "Tracy", "Astronomical", "魂音泉",
          )
          PARENT_ARTISTS = ("Alstroemeria Records", "nomico", "Masayoshi Minoshima")

          def compact(value: str) -> str:
              value = unicodedata.normalize("NFKC", str(value)).casefold()
              return "".join(ch for ch in value if ch.isalnum())

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_tr = False
                  self.in_td = False
                  self.cell = []
                  self.row = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag == "tr":
                      self.in_tr = True; self.row = []
                  elif tag == "td" and self.in_tr:
                      self.in_td = True; self.cell = []
              def handle_data(self, data):
                  if self.in_td: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag == "td" and self.in_td:
                      self.row.append(" ".join(" ".join(self.cell).split()))
                      self.in_td = False
                  elif tag == "tr" and self.in_tr:
                      if self.row: self.rows.append(self.row)
                      self.in_tr = False

          base = Catalog.load(Path("/tmp/pr36-base/data/catalog"))
          cur = Catalog.load(Path("data/catalog"))
          new = [cur.entries[bid] for bid in sorted(set(cur.entries) - set(base.entries))]
          bad = [e for e in new if e.original_themes == ["Bad Apple!!"]]
          zun = [e for e in new if e.original_themes != ["Bad Apple!!"]]
          assert len(bad) == 230 and len(zun) == 126, (len(bad), len(zun))

          # 1) Live Arrangement Chronicle corpus: every Bad Apple row must still
          # independently match exact normalized title and a named identity.
          chronicle = collections.defaultdict(list)
          parsed_rows = 0
          for page_num in range(1, 11):
              parser = TableParser()
              parser.feed(get_text(CHRONICLE_BAD_APPLE + f"?page={page_num}&per=50"))
              for row in parser.rows:
                  if len(row) < 8: continue
                  circle, title = row[1].strip(), row[2].strip()
                  vocalist = row[4].strip() if len(row) > 4 else ""
                  arranger = row[5].strip() if len(row) > 5 else ""
                  originals = row[7].strip() if len(row) > 7 else ""
                  if not title or "badapple" not in compact(originals): continue
                  identities = [v for v in (circle, vocalist, arranger) if v]
                  if identities:
                      chronicle[compact(title)].append((title, identities, originals))
                      parsed_rows += 1
          assert parsed_rows >= 450, parsed_rows

          missing_chronicle = []
          for e in bad:
              matches = [
                  row for row in chronicle.get(compact(e.title), [])
                  if any(artist_matches(e.artist, identity) for identity in row[1])
              ]
              if not matches:
                  missing_chronicle.append((e.beatmapset_id, e.artist, e.title))
          assert not missing_chronicle, f"Bad Apple Chronicle mismatches: {missing_chronicle[:20]}"

          # 2) First-party Alstroemeria release pages must still expose the
          # derivative corpus markers, and rows claiming first-party derivative
          # evidence must correspond to a source-backed title/participant.
          primary_text = "\n".join(get_text(url) for url in PRIMARY_URLS)
          primary_key = compact(primary_text)
          for marker in ("Bad Apple!! feat.nomico", "Camellia", "REDALiCE", "Nhato", "Marasy"):
              assert compact(marker) in primary_key, f"first-party corpus lost marker {marker}"
          official_title_keys = {compact(v) for v in OFFICIAL_TITLES}
          participant_keys = tuple(compact(v) for v in OFFICIAL_PARTICIPANTS)
          parent_keys = tuple(compact(v) for v in PARENT_ARTISTS)
          primary_claims = 0
          parent_claims = 0
          for e in bad:
              ev = set(e.evidence)
              artist_key = compact(e.artist)
              title_key = compact(e.title)
              if "primary:alstroemeria-records" in ev:
                  primary_claims += 1
                  assert title_key in official_title_keys, (e.beatmapset_id, e.title)
                  assert title_key in primary_key, f"first-party page no longer contains title {e.beatmapset_id}: {e.title}"
                  assert any(k and (k in artist_key or artist_key in k) for k in participant_keys if artist_key), (e.beatmapset_id, e.artist)
              if "primary:bad-apple-parent-identity" in ev:
                  parent_claims += 1
                  assert any(k and k in artist_key for k in parent_keys), (e.beatmapset_id, e.artist)
          assert primary_claims == 96, primary_claims
          assert parent_claims == 207, parent_claims

          # 3) Re-run THBWiki/TouhouDB advisory scan for all 230 Bad Apple rows.
          # No explicit contradiction/ambiguity may appear. Every row that claims
          # THBWiki evidence must still be supported by THBWiki now.
          audits = audit_entries(bad, workers=10)
          by_id = {a.beatmapset_id: a for a in audits}
          bad_red = []
          thb_claims = 0
          for e in bad:
              a = by_id[e.beatmapset_id]
              if a.verdict in {"red_flag", "ambiguous"}:
                  bad_red.append((e.beatmapset_id, a.verdict, [h.to_dict() for h in a.hits]))
              if "provenance:thbwiki" in set(e.evidence):
                  thb_claims += 1
                  assert a.verdict == "supported", (e.beatmapset_id, a.verdict, a.errors)
                  assert any(h.provider == "thbwiki" for h in a.supports), (e.beatmapset_id, [h.to_dict() for h in a.hits])
          assert not bad_red, f"external contradiction(s): {bad_red[:10]}"
          assert thb_claims == 130, thb_claims

          # 4) ZUN source chain: every controlled canonical theme must still be
          # present in Arrangement Chronicle's original-song registry AND resolve
          # in TouhouDB to an Original song by ZUN. Then every one of the 126 rows
          # must match its controlled alias set exactly after normalization.
          stats_key = compact(get_text(CHRONICLE_STATS))
          touhoudb_verified_themes = set()
          for canonical in ZUN_THEMES:
              assert compact(canonical) in stats_key, f"Chronicle missing ZUN theme {canonical}"
              params = urllib.parse.urlencode({
                  "query": canonical,
                  "nameMatchMode": "Exact",
                  "fields": "Artists,AdditionalNames,Albums",
                  "maxResults": "30",
                  "getTotalCount": "true",
              })
              payload = get_json(f"{TOUHOUDb_API}?{params}")
              found = False
              for item in payload.get("items", []) if isinstance(payload, dict) else []:
                  if compact(canonical) not in {compact(name) for name in _touhoudb_names(item)}:
                      continue
                  artists = _touhoudb_artists(item)
                  if not any(compact(a) == "zun" for a in artists):
                      continue
                  if _song_type(item).casefold() != "original":
                      continue
                  found = True
                  break
              assert found, f"TouhouDB no longer confirms ZUN original: {canonical}"
              touhoudb_verified_themes.add(canonical)

          for e in zun:
              canonical = e.original_themes[0]
              assert canonical in touhoudb_verified_themes, (e.beatmapset_id, canonical)
              aliases = {compact(v) for v in ZUN_THEMES[canonical]}
              assert compact(e.artist) == "zun", (e.beatmapset_id, e.artist)
              assert compact(e.title) in aliases, (e.beatmapset_id, canonical, e.title)

          print("REVIEW 2 PASS")
          print(f"chronicle_rows={parsed_rows} bad_rows={len(bad)} external_audits={len(audits)}")
          print(f"first_party_claims={primary_claims} parent_claims={parent_claims} thb_claims={thb_claims}")
          print(f"zun_rows={len(zun)} touhoudb_verified_themes={len(touhoudb_verified_themes)}")
          PY
