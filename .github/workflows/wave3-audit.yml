name: Wave 3 composition-backlog diagnostic

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit weak-metadata composition backlog
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import collections
          import json
          import time
          from pathlib import Path

          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_generic_touhou_source, is_touhou_game_source
          from touhou_osu.http import get_text
          from touhou_osu.osu_api import OsuApi, entry_from_osu
          from touhou_osu.provenance import audit_entries
          from touhou_osu.sources import parse_beatmapset_page

          MAX_PAGES = 12
          AUDIT_LIMIT = 1500
          VERIFY_BUFFER = 360
          ALLOWED_STATUS = {"ranked", "loved"}

          base = Catalog.load(Path("data/catalog"))
          config = json.loads(Path("config/seeds.json").read_text(encoding="utf-8"))
          api = OsuApi.from_env()
          api.token()

          discovered: dict[int, dict] = {}
          query_evidence: dict[int, set[str]] = collections.defaultdict(set)
          for query in config.get("discovery_queries", []):
              for raw in api.search(query, max_pages=MAX_PAGES):
                  beatmapset_id = int(raw["id"])
                  discovered[beatmapset_id] = raw
                  query_evidence[beatmapset_id].add(f"discovery_query:{query}")

          weak = []
          for beatmapset_id, raw in discovered.items():
              if beatmapset_id in base.entries:
                  continue
              entry = entry_from_osu(raw, evidence=sorted(query_evidence[beatmapset_id]), confidence="candidate")
              if entry.status not in ALLOWED_STATUS:
                  continue
              if is_generic_touhou_source(entry.source) or is_touhou_game_source(entry.source):
                  continue
              signals = set(entry.evidence)
              score = len(query_evidence[beatmapset_id])
              score += 6 if "known_touhou_artist" in signals else 0
              score += 4 if "mapper_tags" in signals else 0
              score += 2 if entry.confidence == "probable" else 0
              weak.append((entry, len(query_evidence[beatmapset_id]), score))

          weak.sort(key=lambda item: (-item[2], -item[1], item[0].beatmapset_id))
          to_audit = weak[:AUDIT_LIMIT]
          audits = audit_entries([entry for entry, _, _ in to_audit], workers=12)
          audit_by_id = {item.beatmapset_id: item for item in audits}

          verdicts = collections.Counter()
          provider_support = collections.Counter()
          thb_supported = []
          dual_supported = []
          for entry, corroboration, score in to_audit:
              audit = audit_by_id[entry.beatmapset_id]
              verdicts[audit.verdict] += 1
              providers = {hit.provider for hit in audit.supports}
              for provider in providers:
                  provider_support[provider] += 1
              if audit.verdict == "supported" and "thbwiki" in providers:
                  item = (entry, corroboration, score, audit)
                  thb_supported.append(item)
                  if "touhoudb" in providers:
                      dual_supported.append(item)

          # Prefer rows corroborated by both composition databases, then the
          # strongest discovery/tag/artist score. THBWiki is mandatory because
          # it exposes the underlying ogmusic relation used by this audit.
          thb_supported.sort(
              key=lambda item: (
                  -int(any(hit.provider == "touhoudb" for hit in item[3].supports)),
                  -item[2],
                  -item[1],
                  item[0].beatmapset_id,
              )
          )

          verified = []
          verify_failures = []
          for candidate, corroboration, score, audit in thb_supported:
              if len(verified) >= VERIFY_BUFFER:
                  break
              beatmapset_id = candidate.beatmapset_id
              try:
                  raw = api.beatmapset(beatmapset_id)
                  fresh = entry_from_osu(raw, evidence=candidate.evidence, confidence="candidate")
                  if int(raw.get("id", -1)) != beatmapset_id:
                      raise RuntimeError("API ID mismatch")
                  if fresh.status not in ALLOWED_STATUS:
                      raise RuntimeError(f"status drifted to {fresh.status!r}")
                  if is_touhou_game_source(fresh.source):
                      raise RuntimeError("became concrete-game source; belongs to stronger class")
                  page_raw = parse_beatmapset_page(get_text(f"https://osu.ppy.sh/beatmapsets/{beatmapset_id}"))
                  page = entry_from_osu(page_raw, evidence=candidate.evidence, confidence="candidate")
                  fields = ("beatmapset_id", "artist", "title", "creator", "source", "status")
                  mismatches = [field for field in fields if getattr(fresh, field) != getattr(page, field)]
                  if sorted(fresh.modes) != sorted(page.modes):
                      mismatches.append("modes")
                  if mismatches:
                      raise RuntimeError("API/page mismatch: " + ", ".join(mismatches))
                  if fresh.artist != candidate.artist or fresh.title != candidate.title:
                      raise RuntimeError("search/direct identity drift")
                  providers = sorted({hit.provider for hit in audit.supports})
                  originals = sorted({orig for hit in audit.supports if hit.provider == "thbwiki" for orig in hit.originals})
                  verified.append((fresh, corroboration, score, providers, originals, audit))
              except Exception as exc:
                  verify_failures.append((beatmapset_id, str(exc)))
              time.sleep(0.14)

          print("COMPOSITION BACKLOG SUMMARY")
          print(f"base_catalog={len(base.entries)}")
          print(f"unique_search_results={len(discovered)}")
          print(f"weak_ranked_loved_absent={len(weak)}")
          print(f"audited={len(to_audit)}")
          print(f"verdicts={dict(sorted(verdicts.items()))}")
          print(f"provider_support={dict(sorted(provider_support.items()))}")
          print(f"thbwiki_supported_no_contradiction={len(thb_supported)}")
          print(f"dual_supported_no_contradiction={len(dual_supported)}")
          print(f"fresh_api_page_verified={len(verified)}")
          print(f"fresh_verify_failures={len(verify_failures)}")

          signal_counts = collections.Counter()
          for fresh, corroboration, score, providers, originals, audit in verified:
              signals = set(fresh.evidence)
              signal_counts[("artist" if "known_touhou_artist" in signals else "no_artist", "tags" if "mapper_tags" in signals else "no_tags")] += 1
          print(f"verified_signal_classes={dict((str(k), v) for k, v in sorted(signal_counts.items()))}")

          print("\nVERIFIED POOL")
          for fresh, corroboration, score, providers, originals, audit in verified:
              print(json.dumps({
                  "id": fresh.beatmapset_id,
                  "artist": fresh.artist,
                  "title": fresh.title,
                  "source": fresh.source,
                  "status": fresh.status,
                  "modes": fresh.modes,
                  "query_hits": corroboration,
                  "score": score,
                  "providers": providers,
                  "originals": originals,
                  "thbwiki_ids": [hit.provider_id for hit in audit.supports if hit.provider == "thbwiki"],
                  "touhoudb_ids": [hit.provider_id for hit in audit.supports if hit.provider == "touhoudb"],
              }, ensure_ascii=False))

          if verify_failures:
              print("\nVERIFY FAILURES")
              for item in verify_failures[:100]:
                  print(item)
          PY
