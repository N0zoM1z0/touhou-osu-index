name: Temporary PR24 three-pass review

on:
  push:
    branches: [feat/touhou-coverage-200plus-2026-08-21]

permissions:
  contents: read

jobs:
  review-1-static-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact base/head catalog integrity review
        run: |
          set -euo pipefail
          git diff --check 3568c018536bbb914eb3c9a731626e27c5d8ad49..HEAD
          python - <<'PY'
          import json, subprocess
          from collections import Counter
          from pathlib import Path
          from touhou_osu.catalog import Catalog

          BASE = "3568c018536bbb914eb3c9a731626e27c5d8ad49"
          base = json.loads(subprocess.check_output(["git", "show", f"{BASE}:data/catalog.json"], text=True))
          head = json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          assert base["schema_version"] == head["schema_version"] == 1
          b = {int(x["beatmapset_id"]): x for x in base["entries"]}
          h = {int(x["beatmapset_id"]): x for x in head["entries"]}
          assert len(b) == len(base["entries"]) == 2994
          assert len(h) == len(head["entries"]) == 3594
          assert set(b) <= set(h)
          changed_old = [i for i in b if b[i] != h[i]]
          assert not changed_old, f"existing entries changed: {changed_old[:20]}"
          added = sorted(set(h) - set(b))
          assert len(added) == 600, len(added)
          assert [x["beatmapset_id"] for x in head["entries"]] == sorted(h)

          bad = []
          evidence_counts = Counter()
          for i in added:
              x = h[i]
              if x.get("confidence") != "verified": bad.append((i, "confidence", x.get("confidence")))
              ev = x.get("evidence") or []
              if not ev or not any(str(e).startswith("discovery_query:") for e in ev): bad.append((i, "missing_discovery_evidence", ev))
              if any(str(e).startswith("manual:") for e in ev): bad.append((i, "manual_override", ev))
              if not x.get("source"): bad.append((i, "blank_source", ""))
              if not x.get("artist") or not x.get("title") or not x.get("creator"): bad.append((i, "missing_metadata", ""))
              for e in ev: evidence_counts[str(e).split(":",1)[0]] += 1
          assert not bad, bad[:20]
          Catalog.load(Path("data/catalog.json")).validate()
          print("REVIEW1_OK")
          print(json.dumps({"base":len(b),"head":len(h),"added":len(added),"changed_old":len(changed_old),"evidence_prefix_counts":dict(evidence_counts),"min_id":min(added),"max_id":max(added)}, indent=2))
          PY

  review-2-live-direct-refetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refetch every added beatmapset from official osu API
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          BASE = "3568c018536bbb914eb3c9a731626e27c5d8ad49"
          base = json.loads(subprocess.check_output(["git", "show", f"{BASE}:data/catalog.json"], text=True))
          head = json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          b = {int(x["beatmapset_id"]): x for x in base["entries"]}
          h = {int(x["beatmapset_id"]): x for x in head["entries"]}
          ids = sorted(set(h)-set(b))
          api = OsuApi.from_env(); api.token()

          def check(i):
              stored = h[i]
              raw = api.beatmapset(i)
              if int(raw.get("id",-1)) != i: return {"id":i,"error":"id_mismatch"}
              live = entry_from_osu(raw, evidence=stored.get("evidence",[]), confidence="candidate")
              problems=[]
              if live.confidence != "verified": problems.append(f"live_confidence={live.confidence}")
              if not is_explicit_touhou_source(raw.get("source", "")): problems.append("source_not_explicit")
              for field in ("artist","title","creator","source","status"):
                  if str(stored.get(field,"")) != str(getattr(live,field)): problems.append(f"{field}_drift")
              if sorted(stored.get("modes",[])) != sorted(live.modes): problems.append("modes_drift")
              # last_updated can legitimately advance; report rather than fail on it.
              return {"id":i,"problems":problems,"source":raw.get("source", ""),"stored_last_updated":stored.get("osu_last_updated"),"live_last_updated":raw.get("last_updated")}

          with ThreadPoolExecutor(max_workers=8) as pool:
              rows=list(pool.map(check, ids))
          bad=[r for r in rows if r.get("error") or r.get("problems")]
          assert not bad, json.dumps(bad[:30], ensure_ascii=False, indent=2)
          source_counts=Counter(r["source"] for r in rows)
          last_update_drift=sum(r["stored_last_updated"] != r["live_last_updated"] for r in rows)
          print("REVIEW2_OK")
          print(json.dumps({"refetched":len(rows),"rejected":len(bad),"unique_source_strings":len(source_counts),"last_updated_drift_only":last_update_drift,"sources":sorted(source_counts.items(), key=lambda x:(x[0].casefold(),x[0]))}, ensure_ascii=False, indent=2))
          PY

  review-3-discovery-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-run configured discovery and verify provenance for all 600 IDs
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from collections import defaultdict, Counter
          from pathlib import Path
          from touhou_osu.cli import load_config
          from touhou_osu.osu_api import OsuApi

          BASE = "3568c018536bbb914eb3c9a731626e27c5d8ad49"
          base=json.loads(subprocess.check_output(["git","show",f"{BASE}:data/catalog.json"], text=True))
          head=json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          b={int(x["beatmapset_id"]):x for x in base["entries"]}; h={int(x["beatmapset_id"]):x for x in head["entries"]}
          ids=set(h)-set(b)
          config=load_config(Path("config/seeds.json")); queries=list(config.get("discovery_queries",[]))
          api=OsuApi.from_env(); found=defaultdict(set)
          for q in queries:
              for raw in api.search(q, max_pages=4):
                  i=int(raw["id"])
                  if i in ids: found[i].add(q)
          missing=sorted(ids-set(found))
          mismatch=[]
          corroboration=Counter()
          for i in sorted(ids):
              recorded={e.split(":",1)[1] for e in h[i].get("evidence",[]) if e.startswith("discovery_query:")}
              live=found.get(i,set())
              if not (recorded & live): mismatch.append({"id":i,"recorded":sorted(recorded),"live":sorted(live)})
              corroboration[len(live)] += 1
          assert not missing, f"600-set discovery misses: {missing[:50]}"
          assert not mismatch, json.dumps(mismatch[:20], ensure_ascii=False, indent=2)
          print("REVIEW3_OK")
          print(json.dumps({"configured_queries":len(queries),"all_600_rediscovered":len(found),"missing":len(missing),"recorded_live_overlap_failures":len(mismatch),"live_query_hit_distribution":dict(sorted(corroboration.items()))}, ensure_ascii=False, indent=2))
          PY
