name: PR36 mixed provenance diagnostic

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-mixed-provenance-diagnostic.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find accepted Bad Apple rows with multiple supported originals
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations
          import collections, json, unicodedata
          from html.parser import HTMLParser
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.http import get_text
          from touhou_osu.provenance import artist_matches

          BAD = "https://touhou.arrangement-chronicle.com/original_song/%E6%9D%B1%E6%96%B9%E5%B9%BB%E6%83%B3%E9%83%B7/Bad%20Apple!!"
          STATS = "https://touhou.arrangement-chronicle.com/statistics/original_songs"
          def compact(v):
              v=unicodedata.normalize('NFKC',str(v)).casefold()
              return ''.join(ch for ch in v if ch.isalnum())
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.tr=False; self.td=False; self.cell=[]; self.row=[]; self.rows=[]
              def handle_starttag(self,t,a):
                  if t=='tr': self.tr=True; self.row=[]
                  elif t=='td' and self.tr: self.td=True; self.cell=[]
              def handle_data(self,d):
                  if self.td: self.cell.append(d)
              def handle_endtag(self,t):
                  if t=='td' and self.td: self.row.append(' '.join(' '.join(self.cell).split())); self.td=False
                  elif t=='tr' and self.tr:
                      if self.row: self.rows.append(self.row)
                      self.tr=False

          # Full original-theme -> game mapping.
          theme_games={}
          for page in range(1,14):
              p=P(); p.feed(get_text(STATS+f'?page={page}&per=50'))
              for row in p.rows:
                  if len(row)>=4 and row[0].strip().isdigit():
                      theme=row[1].strip(); game=row[2].strip()
                      if theme and game: theme_games[compact(theme)]=(theme,game)
          assert len(theme_games)>=600, len(theme_games)

          corpus=collections.defaultdict(list)
          for page in range(1,11):
              p=P(); p.feed(get_text(BAD+f'?page={page}&per=50'))
              for row in p.rows:
                  if len(row)<8: continue
                  circle,title=row[1].strip(),row[2].strip()
                  vocal=row[4].strip() if len(row)>4 else ''
                  arranger=row[5].strip() if len(row)>5 else ''
                  originals=[x.strip() for x in row[7].replace('／','/').split('\n') if x.strip()]
                  # HTML parser typically flattens cell with spaces; recover originals by exact theme-name matches.
                  original_cell=row[7].strip()
                  supported=[]
                  for key,(theme,game) in theme_games.items():
                      if theme in original_cell:
                          supported.append((theme,game))
                  if title and supported:
                      ids=[x for x in (circle,vocal,arranger) if x]
                      corpus[compact(title)].append((ids,supported,original_cell))

          base=Catalog.load(Path('/tmp/pr36-base/data/catalog'))
          cur=Catalog.load(Path('data/catalog'))
          new=[cur.entries[i] for i in sorted(set(cur.entries)-set(base.entries))]
          bad=[e for e in new if e.original_themes==['Bad Apple!!']]
          mixed=[]; unresolved=[]
          for e in bad:
              rows=[r for r in corpus.get(compact(e.title),[]) if any(artist_matches(e.artist,x) for x in r[0])]
              if not rows:
                  unresolved.append((e.beatmapset_id,e.artist,e.title)); continue
              themes={theme for _,supported,_ in rows for theme,_ in supported}
              games={game for _,supported,_ in rows for _,game in supported}
              if len(themes)>1:
                  mixed.append({'id':e.beatmapset_id,'artist':e.artist,'title':e.title,'themes':sorted(themes),'games':sorted(games),'source_cells':sorted({r[2] for r in rows})})
          assert not unresolved, unresolved[:20]
          print('MIXED STRUCTURED PROVENANCE DIAGNOSTIC')
          print(f'bad_rows={len(bad)} mixed_rows={len(mixed)}')
          for item in mixed:
              print(json.dumps(item,ensure_ascii=False))
          PY
