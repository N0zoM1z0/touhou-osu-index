name: Temporary status-scoped deep discovery audit

on:
  push:
    branches:
      - work/completeness-pass-2026-09-07

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Deep status-scoped discovery and direct refetch
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test -n "$OSU_CLIENT_ID"
          test -n "$OSU_CLIENT_SECRET"
          git fetch --no-tags origin main
          rm -rf "$RUNNER_TEMP/status-base"
          mkdir -p "$RUNNER_TEMP/status-base"
          git archive origin/main data/catalog | tar -x -C "$RUNNER_TEMP/status-base"

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          from touhou_osu.catalog import Catalog
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          temp = Path(os.environ['RUNNER_TEMP'])
          base = Catalog.load(temp / 'status-base' / 'data' / 'catalog')
          base_ids = set(base.entries)
          config = json.loads(Path('config/seeds.json').read_text(encoding='utf-8'))
          api = OsuApi.from_env()
          api.token()

          configured = config.get('discovery_queries', [])
          queries = []
          for query in configured:
              if query.startswith('source=') or query in {
                  'Touhou', '東方', '東方Project', 'ZUN',
                  'Team Shanghai Alice', '上海アリス幻樂団'
              }:
                  if query not in queries:
                      queries.append(query)
          statuses = ['graveyard', 'wip', 'pending']

          raw_by_id = {}
          evidence = defaultdict(set)
          buckets = 0
          pages = 0
          bucket_errors = []

          def fetch_page(params):
              last = None
              for attempt in range(4):
                  try:
                      return api.get('/beatmapsets/search', params)
                  except Exception as exc:
                      last = exc
                      time.sleep(1.5 * (attempt + 1))
              raise last

          for status in statuses:
              for query in queries:
                  buckets += 1
                  cursor = None
                  try:
                      for page_no in range(12):
                          params = {'q': query, 's': status}
                          if cursor:
                              params['cursor_string'] = cursor
                          payload = fetch_page(params)
                          pages += 1
                          for raw in payload.get('beatmapsets', []):
                              beatmapset_id = int(raw['id'])
                              if beatmapset_id in base_ids:
                                  continue
                              probe = entry_from_osu(
                                  raw,
                                  evidence=[f'discovery_query:{query}'],
                                  confidence='candidate',
                              )
                              # Only concrete game-source verification crosses this gate.
                              if probe.confidence != 'verified':
                                  continue
                              raw_by_id[beatmapset_id] = raw
                              evidence[beatmapset_id].add(f'discovery_query:{query}')
                          cursor = payload.get('cursor_string')
                          if not cursor:
                              break
                          time.sleep(0.03)
                  except Exception as exc:
                      bucket_errors.append(f'{status} / {query}: {exc}')

          ranked_ids = sorted(raw_by_id, key=lambda item: (-len(evidence[item]), item))
          prefetch_ids = ranked_ids[:600]

          def refetch(beatmapset_id):
              last = None
              for attempt in range(4):
                  try:
                      raw = api.beatmapset(beatmapset_id)
                      entry = entry_from_osu(
                          raw,
                          evidence=sorted(evidence[beatmapset_id]),
                          confidence='candidate',
                      )
                      return beatmapset_id, entry, None
                  except Exception as exc:
                      last = str(exc)
                      time.sleep(1.5 * (attempt + 1))
              return beatmapset_id, None, last

          accepted = []
          fetch_errors = {}
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = {pool.submit(refetch, item): item for item in prefetch_ids}
              for future in as_completed(futures):
                  beatmapset_id, entry, error = future.result()
                  if error:
                      fetch_errors[beatmapset_id] = error
                  elif entry.confidence == 'verified':
                      accepted.append(entry)

          accepted.sort(key=lambda e: (-len(e.evidence), e.beatmapset_id))
          provisional = accepted[:400]
          meta = {
              'base_entries': len(base.entries),
              'queries': len(queries),
              'statuses': statuses,
              'buckets': buckets,
              'pages': pages,
              'bucket_errors': bucket_errors,
              'unique_absent_verified_search_hits': len(raw_by_id),
              'direct_refetch_attempted': len(prefetch_ids),
              'direct_refetch_failures': {str(k): v for k, v in sorted(fetch_errors.items())},
              'accepted_after_refetch': len(accepted),
              'provisional_ids': [e.beatmapset_id for e in provisional],
          }
          print(json.dumps({k: v for k, v in meta.items() if k not in {'direct_refetch_failures', 'bucket_errors'}}, indent=2))
          if bucket_errors:
              print('BUCKET_ERRORS', len(bucket_errors))
              for error in bucket_errors[:20]:
                  print(' ', error)
          if len(provisional) < 220:
              raise RuntimeError(f"status-scoped verified pool too small: {len(provisional)}")

          working = Catalog(base.entries.values())
          for entry in provisional:
              working.merge(entry)
          working.save(Path('data/catalog'))
          (temp / 'status-meta.json').write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: External composition provenance pass
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python -m touhou_osu.provenance \
            --catalog data/catalog \
            --base-catalog "$RUNNER_TEMP/status-base/data/catalog" \
            --scope changed \
            --workers 4 \
            --output "$RUNNER_TEMP/status-provenance.json"

      - name: Filter provenance flags and write audit document
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from touhou_osu.catalog import Catalog

          temp = Path(os.environ['RUNNER_TEMP'])
          base = Catalog.load(temp / 'status-base' / 'data' / 'catalog')
          current = Catalog.load(Path('data/catalog'))
          meta = json.loads((temp / 'status-meta.json').read_text(encoding='utf-8'))
          provenance = json.loads((temp / 'status-provenance.json').read_text(encoding='utf-8'))

          bad = {int(item) for item in provenance.get('policy_violations', [])}
          supported = set()
          verdict_by_id = {}
          for row in provenance.get('results', []):
              beatmapset_id = int(row['beatmapset_id'])
              verdict = row.get('verdict', 'unknown')
              verdict_by_id[beatmapset_id] = verdict
              if verdict in {'red_flag', 'ambiguous'}:
                  bad.add(beatmapset_id)
              if verdict == 'supported':
                  supported.add(beatmapset_id)

          candidates = [
              current.entries[item] for item in meta['provisional_ids']
              if item in current.entries and item not in bad
          ]
          candidates.sort(
              key=lambda e: (
                  0 if e.beatmapset_id in supported else 1,
                  -len(e.evidence),
                  e.beatmapset_id,
              )
          )
          chosen = candidates[:250]
          if len(chosen) < 200:
              raise RuntimeError(
                  f"only {len(chosen)} rows remain after provenance filtering; "
                  f"provisional={len(meta['provisional_ids'])}, flagged={len(bad)}"
              )

          final = Catalog(base.entries.values())
          for entry in chosen:
              final.merge(entry)
          final.save(Path('data/catalog'))

          positive = sum(e.beatmapset_id in supported for e in chosen)
          status_counts = {}
          mode_counts = {}
          for entry in chosen:
              status_counts[entry.status] = status_counts.get(entry.status, 0) + 1
              for mode in entry.modes:
                  mode_counts[mode] = mode_counts.get(mode, 0) + 1

          def esc(text):
              return str(text).replace('|', '\\|').replace('\n', ' ')

          lines = [
              '# Status-scoped Touhou discovery audit — 2026-09-07',
              '',
              '## Decision',
              '',
              f'Add **{len(chosen)}** beatmapsets missing from the current main catalog. Every row is addition-only and crossed the repository deterministic `verified` boundary from a concrete recognized Touhou game source in current osu! metadata.',
              '',
              '## Why this pass exists',
              '',
              'The normal weekly discovery searches the configured terms without an explicit status partition and caps meaningful changes. The previous wave-3 audit demonstrated that the long tail is overwhelmingly graveyard material. This pass therefore reuses the existing source/game queries but partitions the official osu! search by `graveyard`, `wip`, and `pending`, then paginates each bucket much deeper.',
              '',
              '## Search breadth',
              '',
              f"- base catalog: **{meta['base_entries']}** beatmapsets",
              f"- strong configured queries: **{meta['queries']}**",
              f"- status buckets: **{len(meta['statuses'])}** ({', '.join(meta['statuses'])})",
              f"- query/status buckets attempted: **{meta['buckets']}**",
              f"- official osu! search pages fetched: **{meta['pages']}**",
              f"- unique absent verified search hits: **{meta['unique_absent_verified_search_hits']}**",
              f"- direct `/api/v2/beatmapsets/<id>` refetches attempted: **{meta['direct_refetch_attempted']}**",
              f"- accepted after direct refetch: **{meta['accepted_after_refetch']}**",
              f"- provisional rows sent to THBWiki/TouhouDB provenance: **{len(meta['provisional_ids'])}**",
              f"- final rows after red/ambiguous/policy filtering: **{len(chosen)}**",
              f"- positive external composition relations among final rows: **{positive}**",
              f"- status distribution: **{json.dumps(status_counts, ensure_ascii=False, sort_keys=True)}**",
              f"- mode coverage: **{json.dumps(mode_counts, ensure_ascii=False, sort_keys=True)}**",
              '',
              'Search keyword membership was never sufficient. Search results were first classified from their current API object, then every shortlisted ID was fetched again from the direct beatmapset endpoint. External provenance contradictions/ambiguity were removed before the final set was locked. The following step runs the repository Deep Review, including a second API fetch plus the public beatmapset page for exact identity agreement.',
              '',
              '## Accepted beatmapsets',
              '',
              '| Beatmapset ID | Artist | Title | Source | Status | Modes | Provenance verdict |',
              '| ---: | --- | --- | --- | --- | --- | --- |',
          ]
          for entry in sorted(chosen, key=lambda e: e.beatmapset_id):
              lines.append(
                  f"| {entry.beatmapset_id} | {esc(entry.artist)} | {esc(entry.title)} | {esc(entry.source)} | {entry.status} | {','.join(entry.modes)} | {verdict_by_id.get(entry.beatmapset_id, 'unknown')} |"
              )
          lines += [
              '',
              '## Negative boundary',
              '',
              'Candidate/probable-only hits, generic Touhou source labels, mapper-tag-only signals, direct-refetch failures, external contradictions, ambiguous provenance, and policy violations are all withheld. Existing catalog rows are restored exactly and are not refreshed or reclassified in this PR.',
              '',
              '## Final verification',
              '',
              'The temporary workflow runs `make check`, `make build`, `git diff --check`, and `touhou_osu.pr_audit --mode all --scope added --forbid-existing-changes`. Exact Deep Review counts are appended before committing.',
          ]
          audit_path = Path('docs/source-audit-2026-09-status-depth.md')
          audit_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          (temp / 'final-count.txt').write_text(str(len(chosen)), encoding='utf-8')
          print(f'FINAL_COUNT {len(chosen)}; external-supported={positive}; flagged={len(bad)}')
          PY

      - name: Validate and run full Deep Review
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          count=$(cat "$RUNNER_TEMP/final-count.txt")
          make check
          make build
          git diff --check
          python -m touhou_osu.pr_audit \
            --base-ref origin/main \
            --mode all \
            --scope added \
            --audit-doc docs/source-audit-2026-09-status-depth.md \
            --expected-additions "$count" \
            --forbid-existing-changes \
            --workers 4 \
            --output "$RUNNER_TEMP/status-deep-review.json"

      - name: Append review result and commit
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          report = json.loads((temp / 'status-deep-review.json').read_text(encoding='utf-8'))
          structural = report['structural']
          provenance = report.get('provenance') or {}
          live = report.get('live_osu') or {}
          path = Path('docs/source-audit-2026-09-status-depth.md')
          with path.open('a', encoding='utf-8') as handle:
              handle.write('\n### Deep Review result\n\n')
              handle.write(f"- status: **{report['status']}**\n")
              handle.write(f"- structural diff: **+{len(structural['added'])} / ~{len(structural['modified'])} / -{len(structural['removed'])}**\n")
              handle.write(f"- provenance: checked **{provenance.get('checked', 0)}**, positive **{provenance.get('supported', 0)}**, review flags **{len(provenance.get('review_flags', []))}**, provider errors **{provenance.get('provider_errors', 0)}**\n")
              handle.write(f"- live osu! exact identity: checked **{live.get('checked', 0)}**, failures **{len(live.get('failures', []))}**\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog docs/source-audit-2026-09-status-depth.md
          git commit -m "data: add status-scoped Touhou discovery batch"
          git push origin HEAD:work/completeness-pass-2026-09-07
