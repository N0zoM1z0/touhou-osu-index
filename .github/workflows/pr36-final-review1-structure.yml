name: PR36 final review 1 - structure

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-final-review1-structure.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exhaustive catalog and audit invariants
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations
          import collections, re, subprocess, unicodedata
          from pathlib import Path
          from touhou_osu.catalog import Catalog

          EXPECTED_NEW=356
          MIXED_ID=2603026
          MIXED_THEMES=['Bad Apple!!','装飾戦 ～ Decoration Battle','霊戦 ～ Perdition crisis']
          ZUN_THEME_GAMES={
              'U.N.オーエンは彼女なのか？':'東方紅魔郷 ～ the Embodiment of Scarlet Devil.',
              '亡き王女の為のセプテット':'東方紅魔郷 ～ the Embodiment of Scarlet Devil.',
              '恋色マスタースパーク':'東方永夜抄 ～ Imperishable Night.',
              'ネクロファンタジア':'東方妖々夢 ～ Perfect Cherry Blossom.',
              'おてんば恋娘':'東方紅魔郷 ～ the Embodiment of Scarlet Devil.',
              'ハルトマンの妖怪少女':'東方地霊殿 ～ Subterranean Animism.',
              '月まで届け、不死の煙':'東方永夜抄 ～ Imperishable Night.',
          }
          def compact(v):
              v=unicodedata.normalize('NFKC',str(v)).casefold()
              return ''.join(ch for ch in v if ch.isalnum())

          base=Catalog.load(Path('/tmp/pr36-base/data/catalog'))
          cur=Catalog.load(Path('data/catalog'))
          assert len(base.entries)==4438, len(base.entries)
          assert len(cur.entries)==4794, len(cur.entries)
          base_ids=set(base.entries); cur_ids=set(cur.entries)
          assert not (base_ids-cur_ids)
          new_ids=sorted(cur_ids-base_ids)
          assert len(new_ids)==EXPECTED_NEW, len(new_ids)

          changed_old=[bid for bid in sorted(base_ids) if base.entries[bid].to_dict()!=cur.entries[bid].to_dict()]
          assert not changed_old, changed_old[:20]

          bad=[]; zun=[]
          status=collections.Counter(); kind=collections.Counter()
          for bid in new_ids:
              e=cur.entries[bid]; ev=set(e.evidence)
              assert e.confidence=='verified' and 'manual:verified' in ev
              assert 'audit:wave3-deep-coverage-2026-09' in ev
              assert e.last_checked=='2026-09-06'
              assert e.artist and e.title and e.creator
              status[e.status]+=1; kind[e.touhou_kind]+=1
              is_bad='provenance:arrangement-chronicle-bad-apple' in ev
              is_zun='identity:zun-exact-original-title' in ev
              assert is_bad != is_zun, (bid,is_bad,is_zun)
              if is_bad: bad.append(e)
              else: zun.append(e)

          assert len(bad)==230 and len(zun)==126, (len(bad),len(zun))
          assert dict(status)=={'graveyard':352,'ranked':1,'wip':3}, status
          assert kind['original']==126 and kind['mixed']==1 and kind['arrangement']==229, kind

          for e in bad:
              assert len(e.origin_games)==1 and compact(e.origin_games[0])==compact('東方幻想郷 ～ Lotus Land Story')
              if e.beatmapset_id==MIXED_ID:
                  assert e.touhou_kind=='mixed'
                  assert e.original_themes==sorted(MIXED_THEMES,key=str.casefold)
                  assert 'provenance:arrangement-chronicle-multi-original' in set(e.evidence)
              else:
                  assert e.touhou_kind=='arrangement', (e.beatmapset_id,e.touhou_kind)
                  assert e.original_themes==['Bad Apple!!'], (e.beatmapset_id,e.original_themes)

          for e in zun:
              assert e.touhou_kind=='original'
              assert len(e.original_themes)==1 and e.original_themes[0] in ZUN_THEME_GAMES
              assert len(e.origin_games)==1 and compact(e.origin_games[0])==compact(ZUN_THEME_GAMES[e.original_themes[0]])
              assert compact(e.artist)=='zun'
              assert 'provenance:arrangement-chronicle-original-theme' in set(e.evidence)

          audit=Path('docs/source-audit-2026-09-wave3-deep-coverage.md').read_text(encoding='utf-8')
          audit_ids=[int(m.group(1)) for line in audit.splitlines() if (m:=re.match(r'^\|\s*(\d+)\s*\|',line))]
          assert len(audit_ids)==356 and len(set(audit_ids))==356
          assert sorted(audit_ids)==new_ids
          for needle in (
              '### Mixed structured provenance correction',
              '- `装飾戦 ～ Decoration Battle`: **1**',
              '- `霊戦 ～ Perdition crisis`: **1**',
              'final accepted after current API + public-page verification: **356**',
              'catalog after write: **4794**',
          ):
              assert needle in audit, needle

          changed=subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines()
          unexpected=[p for p in changed if not p.startswith('data/catalog/') and p!='docs/source-audit-2026-09-wave3-deep-coverage.md' and not p.startswith('.github/workflows/pr36-')]
          assert not unexpected, unexpected
          print('FINAL REVIEW 1 PASS')
          print(f'base={len(base.entries)} final={len(cur.entries)} new={len(new_ids)} old_changed={len(changed_old)}')
          print(f'bad={len(bad)} zun={len(zun)} kinds={dict(kind)} statuses={dict(status)} audit_ids={len(audit_ids)}')
          PY
      - name: Standard validation
        run: |
          make check
          make build
          git diff --check origin/main...HEAD
