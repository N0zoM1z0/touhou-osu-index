name: Temporary Moonlight Festival source audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve exact mappool beatmap IDs to beatmapsets
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile

          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.google_sheets import (
              _DOCUMENT_REL_NS, _SPREADSHEET_NS, _normalize_archive_path,
              _relationship_targets, _shared_strings, _worksheet_texts,
              fetch_google_sheet_beatmapset_ids, google_sheet_export_url,
          )
          from touhou_osu.http import get_text, request
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          FORUM = "https://osu.ppy.sh/community/forums/topics/2029871"
          SHEET_ID = "1nqD85CClkgNIHxMU2KVGfcs2i5QphzIEupGxuiqlf04"
          SHEET = "Маппул"

          forum = get_text(FORUM)
          for phrase in ("Touhou Project", "тематическим набором карт", "Spreadsheet"):
              assert phrase in forum, f"forum provenance phrase missing: {phrase}"
          assert fetch_google_sheet_beatmapset_ids(SHEET_ID, sheet_names=[SHEET]) == []
          payload = request(google_sheet_export_url(SHEET_ID), headers={"Accept":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})

          exact_ids=[]; exact_seen=set()
          with ZipFile(BytesIO(payload)) as archive:
              workbook_path="xl/workbook.xml"
              workbook=ET.fromstring(archive.read(workbook_path))
              rels=_relationship_targets(archive.read("xl/_rels/workbook.xml.rels"))
              shared=_shared_strings(archive)
              selected=0
              for sheet in workbook.findall(f".//{{{_SPREADSHEET_NS}}}sheet"):
                  if sheet.attrib.get("name") != SHEET: continue
                  selected += 1
                  rid=sheet.attrib.get(f"{{{_DOCUMENT_REL_NS}}}id","")
                  path=_normalize_archive_path(workbook_path,rels[rid])
                  for text in _worksheet_texts(archive,path,shared):
                      for m in re.finditer(r"https?://osu\.ppy\.sh/b/(\d+)", text, re.I):
                          i=int(m.group(1))
                          if i not in exact_seen: exact_seen.add(i); exact_ids.append(i)
              assert selected == 1, f"expected exactly one {SHEET!r} worksheet, found {selected}"
          assert exact_ids, "selected mappool worksheet contains no /b/ hyperlinks"

          api=OsuApi.from_env(); api.token()
          def resolve(beatmap_id):
              try:
                  raw=api.get(f"/beatmaps/{beatmap_id}")
                  if int(raw.get("id",-1)) != beatmap_id:
                      return {"beatmap_id":beatmap_id,"error":"id_mismatch"}
                  return {"beatmap_id":beatmap_id,"beatmapset_id":int(raw["beatmapset_id"])}
              except Exception as exc:
                  return {"beatmap_id":beatmap_id,"error":f"{type(exc).__name__}:{exc}"}
          with ThreadPoolExecutor(max_workers=8) as pool:
              resolved=list(pool.map(resolve, exact_ids))
          unresolved=[x for x in resolved if "error" in x]
          exact_pairs=[(x["beatmap_id"],x["beatmapset_id"]) for x in resolved if "beatmapset_id" in x]
          beatmapset_ids=sorted({s for _,s in exact_pairs})

          catalog=Catalog.load(Path("data/catalog.json")); existing=set(catalog.entries)
          missing=sorted(set(beatmapset_ids)-existing)
          def live_set(i):
              raw=api.beatmapset(i)
              entry=entry_from_osu(raw,evidence=["tournament:google_sheet:tmf-2025"],confidence="verified")
              return {"beatmapset_id":i,"artist":entry.artist,"title":entry.title,"creator":entry.creator,"source":entry.source,"status":entry.status,"modes":entry.modes,"classifier_confidence":entry.confidence,"explicit_touhou_source":is_explicit_touhou_source(entry.source)}
          with ThreadPoolExecutor(max_workers=8) as pool:
              live_missing=list(pool.map(live_set,missing))

          print("MOONLIGHT_RESOLVE_BEGIN")
          print(json.dumps({
              "forum_provenance_ok":True,
              "sheet":SHEET,
              "exact_mappool_beatmap_ids":len(exact_ids),
              "resolved_beatmap_ids":len(exact_pairs),
              "unresolved_beatmap_ids":unresolved,
              "unique_resolved_beatmapsets":len(beatmapset_ids),
              "duplicate_difficulties_same_set":len(exact_pairs)-len(beatmapset_ids),
              "already_in_catalog":len(set(beatmapset_ids)&existing),
              "missing_from_catalog":len(missing),
              "missing_beatmapset_ids":missing,
              "beatmap_to_set":[{"beatmap_id":b,"beatmapset_id":s} for b,s in exact_pairs],
              "live_missing":live_missing,
              "missing_explicit_source_counts":dict(Counter(str(x["explicit_touhou_source"]) for x in live_missing)),
          }, ensure_ascii=False, indent=2))
          print("MOONLIGHT_RESOLVE_END")
          PY
