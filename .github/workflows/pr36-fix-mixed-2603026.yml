name: PR36 fix mixed structured provenance

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-fix-mixed-2603026.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct structured provenance for beatmapset 2603026
        run: |
          python - <<'PY'
          from pathlib import Path
          from touhou_osu.catalog import Catalog

          CATALOG = Path("data/catalog")
          AUDIT = Path("docs/source-audit-2026-09-wave3-deep-coverage.md")
          BID = 2603026
          EXPECTED_THEMES = [
              "Bad Apple!!",
              "装飾戦 ～ Decoration Battle",
              "霊戦 ～ Perdition crisis",
          ]

          catalog = Catalog.load(CATALOG)
          entry = catalog.entries[BID]
          assert entry.artist == "IOSYS", entry.artist
          assert entry.title == "Bad Apple & Good Orange", entry.title
          assert entry.touhou_kind == "arrangement", entry.touhou_kind
          assert entry.original_themes == ["Bad Apple!!"], entry.original_themes
          assert len(entry.origin_games) == 1 and "Lotus Land Story" in entry.origin_games[0], entry.origin_games
          assert "provenance:arrangement-chronicle-bad-apple" in set(entry.evidence), entry.evidence

          entry.touhou_kind = "mixed"
          entry.original_themes = EXPECTED_THEMES
          entry.evidence = sorted(set(entry.evidence) | {"provenance:arrangement-chronicle-multi-original"}, key=str.casefold)
          entry.normalize()
          entry.validate()
          catalog.save(CATALOG)

          reloaded = Catalog.load(CATALOG)
          fixed = reloaded.entries[BID]
          assert fixed.touhou_kind == "mixed"
          assert fixed.original_themes == sorted(EXPECTED_THEMES, key=str.casefold)
          assert "provenance:arrangement-chronicle-multi-original" in set(fixed.evidence)

          text = AUDIT.read_text(encoding="utf-8")
          marker = "- `恋色マスタースパーク`: **6**\n"
          replacement = marker + "- `装飾戦 ～ Decoration Battle`: **1**\n- `霊戦 ～ Perdition crisis`: **1**\n"
          assert marker in text
          assert "`装飾戦 ～ Decoration Battle`: **1**" not in text
          text = text.replace(marker, replacement, 1)

          anchor = "\n## Accepted beatmapsets\n"
          section = """

### Mixed structured provenance correction

The pre-merge review found one accepted Bad Apple recording whose structured provenance was incomplete even though the beatmapset itself was correctly in scope. Beatmapset `2603026` — **IOSYS — Bad Apple & Good Orange** — is documented by the live Arrangement Chronicle corpus as using three Touhou originals: `Bad Apple!!`, `装飾戦 ～ Decoration Battle`, and `霊戦 ～ Perdition crisis`. All three originate from `東方幻想郷 ～ Lotus Land Story`, so `origin_games` remains one game while `touhou_kind` is corrected from `arrangement` to `mixed` and all three supported originals are retained.

A full reverse scan of all 230 accepted Bad Apple rows against the same live corpus found no other accepted row with more than one supported original, so this is the only structured-provenance correction required by the pre-merge review.
"""
          assert anchor in text
          assert "### Mixed structured provenance correction" not in text
          text = text.replace(anchor, section + anchor, 1)
          AUDIT.write_text(text, encoding="utf-8")
          print("FIX PASS: 2603026 -> mixed with 3 supported Touhou originals")
          PY
      - name: Validate corrected repository
        run: |
          make check
          make build
          git diff --check
      - name: Commit corrected data and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog docs/source-audit-2026-09-wave3-deep-coverage.md
          git diff --cached --quiet && { echo "No data correction staged"; exit 1; }
          git commit -m "data: fix mixed Bad Apple structured provenance"
          git push origin HEAD:feat/touhou-coverage-wave3-2026-09
