name: Temporary status-depth wave 2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: status-depth-wave2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.head_ref == 'work/status-depth-wave2-2026-09-14'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/status-depth-wave2-2026-09-14
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reviewed addition-only batch
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          test -n "$OSU_CLIENT_ID"
          test -n "$OSU_CLIENT_SECRET"
          PYTHONPATH=. python scripts/status_depth_wave2.py | tee /tmp/status-depth-summary.json
      - name: Validate generated tree
        run: |
          git diff --check
          make check
          make build
      - name: Deep Review all 250 additions
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          git fetch origin main
          BASE=origin/main \
          MODE=all \
          SCOPE=added \
          WORKERS=4 \
          AUDIT_DOC=docs/source-audit-2026-09-status-depth-wave2.md \
          EXPECTED_ADDITIONS=250 \
          FORBID_EXISTING_CHANGES=1 \
          REQUIRE_BASE_ANCESTOR=1 \
          AUDIT_OUTPUT=/tmp/status-depth-deep-review.json \
          make audit-pr
      - name: Commit only permanent data and audit evidence
        env:
          BRANCH: work/status-depth-wave2-2026-09-14
        run: |
          rm scripts/status_depth_wave2.py
          rm .github/workflows/status-depth-wave2-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'data: add 250 more status-scoped Touhou beatmapsets'
          git push origin HEAD:"$BRANCH"
