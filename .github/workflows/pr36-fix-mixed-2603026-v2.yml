name: PR36 fix mixed structured provenance v2

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-fix-mixed-2603026-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct structured provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          CATALOG=Path('data/catalog')
          AUDIT=Path('docs/source-audit-2026-09-wave3-deep-coverage.md')
          themes=['Bad Apple!!','装飾戦 ～ Decoration Battle','霊戦 ～ Perdition crisis']
          c=Catalog.load(CATALOG)
          e=c.entries[2603026]
          assert (e.artist,e.title)==('IOSYS','Bad Apple & Good Orange')
          assert e.touhou_kind=='arrangement'
          assert e.original_themes==['Bad Apple!!']
          assert len(e.origin_games)==1 and 'Lotus Land Story' in e.origin_games[0]
          e.touhou_kind='mixed'
          e.original_themes=themes
          e.evidence=sorted(set(e.evidence)|{'provenance:arrangement-chronicle-multi-original'},key=str.casefold)
          e.normalize(); e.validate(); c.save(CATALOG)
          r=Catalog.load(CATALOG).entries[2603026]
          assert r.touhou_kind=='mixed'
          assert r.original_themes==sorted(themes,key=str.casefold)
          text=AUDIT.read_text(encoding='utf-8')
          marker='- `恋色マスタースパーク`: **6**\n'
          assert marker in text and '### Mixed structured provenance correction' not in text
          text=text.replace(marker,marker+'- `装飾戦 ～ Decoration Battle`: **1**\n- `霊戦 ～ Perdition crisis`: **1**\n',1)
          anchor='\n## Accepted beatmapsets\n'
          section='\n'.join([
              '',
              '### Mixed structured provenance correction',
              '',
              'The pre-merge review found one accepted Bad Apple recording whose structured provenance was incomplete even though the beatmapset itself was correctly in scope. Beatmapset `2603026` — **IOSYS — Bad Apple & Good Orange** — is documented by the live Arrangement Chronicle corpus as using three Touhou originals: `Bad Apple!!`, `装飾戦 ～ Decoration Battle`, and `霊戦 ～ Perdition crisis`. All three originate from `東方幻想郷 ～ Lotus Land Story`, so `origin_games` remains one game while `touhou_kind` is corrected from `arrangement` to `mixed` and all three supported originals are retained.',
              '',
              'A full reverse scan of all 230 accepted Bad Apple rows against the same live corpus found no other accepted row with more than one supported original, so this is the only structured-provenance correction required by the pre-merge review.',
              '',
          ])
          assert anchor in text
          text=text.replace(anchor,'\n'+section+anchor,1)
          AUDIT.write_text(text,encoding='utf-8')
          print('FIX PASS: 2603026 mixed provenance corrected')
          PY
      - name: Validate corrected repository
        run: |
          make check
          make build
          git diff --check
      - name: Commit corrected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog docs/source-audit-2026-09-wave3-deep-coverage.md
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "data: fix mixed Bad Apple structured provenance"
          git push origin HEAD:feat/touhou-coverage-wave3-2026-09
