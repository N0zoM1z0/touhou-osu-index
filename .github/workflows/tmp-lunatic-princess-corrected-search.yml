name: Temporary corrected Lunatic Princess systematic search

on:
  pull_request:

permissions:
  contents: read

jobs:
  corrected-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search 191 source-backed arrangements with round-trip assertions
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, unicodedata
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          # Wave 1 is the reviewed 103-row corpus in the permanent audit document.
          text=Path('docs/source-audit-2026-08-lunatic-princess.md').read_text(encoding='utf-8')
          WAVE1=[]
          for line in text.splitlines():
              m=re.match(r'^\| `(.+?)` \| `(.+?)` \|$',line)
              if not m: continue
              title,guard=m.groups()
              WAVE1.append((title, None if guard.startswith('none;') else guard))
          assert len(WAVE1)==103, len(WAVE1)

          # Wave 2 focuses on arrangements whose titles do not visibly reveal the original theme.
          WAVE2=[
            ('夜が動く','IOSYS'),('Eternal moon','Silver Forest'),('すごいえーりん・その1','COOL&CREATE'),('すごいえーりん・その2','COOL&CREATE'),
            ('あなたがここにいなくても','OTAKU-ELITE Recordings'),('千年幻想郷 ～ 竹取飛翔','Forest306'),('蓬莱の家庭教師','街角麻婆豆'),('Hazy Moon','Echoes Construction'),
            ('摂氏零℃がワタシの体温',"Pizuya\'s Cell"),('Furniture Store','surreacheese'),('邦楽合奏の為の「竹取飛翔 ～ Lunatic Princess」','外柿山'),
            ('EXTRA - Through the Looking glass ～ モウヒトリノ姫君','WAVE'),('月見草','WAVEDRIVE'),('俺的、サニーサイド ～某キャラ萌え的サウンド～','CTBR'),
            ('ニセモノノオツキサマ','Black Onyx'),('No return','CODE-49'),('Help me,ERINNNNN!! 締切 ver','COOL&CREATE'),('Resurrection','Croak Not Rue'),
            ('永夜 抄太(39)','FullMooN.13'),('極東アウトブレイク対策本部','Iemitsu.'),('タイクツ','Aria Rhythm'),('Happiness of pretense','FOX RAVEL×KINZOK ON'),
            ('Dream Fragment','FOX RAVEL×KINZOK ON'),('Take to Re:PS','Sound CYCLONE'),('竹取飛翔 ～ Help me, ERINNNNNN!!','TAMUSIC'),('quiet night','もぱた。'),
            ('La princesa lunática','CXR Record'),('笑体不明','DiGiTAL WiNG'),('Bamboo Princess','Login Records'),('Order To Thumbs Up','Rolling Contact'),
            ('竹取飛翔 ～ Lunatic Princess (Ryu☆Remix)','Ryu☆'),('月夜のレインドロップ',"Sister\'s Spread-i"),('Road to the sky',"Sister\'s Spread-i"),
            ('ライト、ムーンライト',"Sister\'s Spread-i"),('永月饗宴','THE SERGEANT'),('Secret Traveler','Adust Rain'),('Better bow than break','Baguettes Ensemble'),
            ('竹取ふらいとッ☆ to: Luna /from: our Tokyo','Iemitsu.'),('竹取TOKYO物語～Shibuya Street Princess','Iemitsu.'),('rotater','LOVEマシーン'),
            ('Lunatic Jump!','Shingo Dj'),('夢花火','Sun Flower Field'),('Flowing Destiny','魂音泉×Kissing the Mirror'),('Fullmoon Tonight','3S Cubic'),
            ('永遠亭','AQUA STYLE'),('Kill Myself','Bluetrain×GO-ZEN'),('YES！最高Princess☆','Innocent Key'),('The Moon sees us','LIMBO-54'),
            ('Hypnotic Waltz','M3tamix Records'),('Paladin','Music Advance'),('蒼天月下','R/K Project'),('Guilty Princess 2011 rearrange mix','Studio “Syrup Comfiture”'),
            ('其れは砌の物語','TAMUSIC'),('誘いの月輪','Tutti Sound'),('永遠亭組曲','Tutti Sound'),('Lunatic Princess -2011 Club Mix-','laughing out loud'),
            ('HARU NO KUDANZAKA','minimum electric design'),('Moonscraper','GET IN THE RING'),('HOPE','SNUG SPACE'),('竹取飛翔-Vocal-',"SYNC.ART\'S"),
            ('慰めの永遠亭','ShibayanRecords'),('Day before going down','Spoo and Nick'),('daystar in the dark','ZYTOKINE'),('かぐやひめ','音召缶'),
            ('Moonlight','緋月ノ雫'),('永遠亭イントロ','かぷりこーん'),('ボス撃破','かぷりこーん'),('Guilty Princess','AniPix'),
            ('Hard work Princess','ジェリコの法則'),('竹取飛翔(drum step Remix)','D.I.C.S.'),('Colleen from the moon','Casket'),('竹通ル日昇','Azure Line'),
            ('RECOLLECT MOON(Special Inst. Version)','博麗神社社務所'),('ナヨタケノークライ','荒御霊'),('FeTiO3','荒御霊'),('闇月夜','=NeutraL='),
            ('Mysterium Vinyl','非可逆リズム'),('天涯蠱毒','GET IN THE RING×東方事変'),('Re:story','Freedom Phantasm'),('Lunatic Dance','Lunatic Gate'),
            ('竹取飛翔 -Lunatic Princess-(Ebon Remix)','Lunatic Gate'),('永','紺碧Studio'),('TAG FORCE','ガネメ'),('久遠の郷 ～ Farewell, Dear Moon','笹川家'),
            ('Never Die','ハコビバ'),('不滅の罪人','東方深晴霞'),('本当','雲あがり'),('かごめ','雲あがり')
          ]
          assert len(WAVE2)==88
          CORPUS=[]; seen_pairs=set()
          for pair in WAVE1+WAVE2:
              if pair not in seen_pairs:
                  seen_pairs.add(pair); CORPUS.append(pair)
          assert len(CORPUS)==191

          def norm(value):
              return ''.join(ch for ch in unicodedata.normalize('NFKC',value or '').casefold() if ch.isalnum())
          def artist_ok(actual, guard):
              if not guard: return True
              a,g=norm(actual),norm(guard)
              return bool(a and g and (a in g or g in a))

          DIRECT_PREFIXES=[norm('竹取飛翔'),norm('Taketori Hishou'),norm('Flight of the Bamboo Cutter')]
          HELP_PREFIX=norm('Help me, ERINNNNNN!!')
          TSURU_PREFIX=norm('Tsurupettan')

          # Exact corpus title/artist correspondence is the default. Only three distinctive,
          # source-backed families allow controlled suffix variants.
          def source_matches(artist,title):
              a=norm(artist); t=norm(title); matches=[]
              for expected,guard in CORPUS:
                  if t==norm(expected) and artist_ok(artist,guard):
                      matches.append({'kind':'corpus_exact','title':expected,'guard':guard})
              if any(t.startswith(p) for p in DIRECT_PREFIXES):
                  matches.append({'kind':'original_alias','title':title,'guard':None})
              if t.startswith(HELP_PREFIX):
                  matches.append({'kind':'help_me_family','title':title,'guard':None})
              if t.startswith(TSURU_PREFIX) and norm('silverforest') in a:
                  matches.append({'kind':'tsurupettan_alias','title':title,'guard':'Silver Forest'})
              return matches

          # Short/generic titles are searched with the documented artist guard; distinctive
          # titles are searched by title alone to catch artist formatting/vocalist differences.
          GENERIC={norm(x) for x in ['Lunatic Princess','Moonlit Night','Sign','SINK','sola','Crazy Diamond','Entrance to Moon','devastator','Dreaming Moon','Moonlight','HOPE','Paladin','Re:story','Lunatic Dance','Guilty Princess','Never Die','本当','かごめ','永','quiet night','No return','Resurrection','Dream Fragment','Bamboo Princess','Order To Thumbs Up','Road to the sky']}
          queries=[]; seen_q=set()
          for title,guard in CORPUS:
              q=f'{guard} {title}' if guard and (norm(title) in GENERIC or len(norm(title))<7) else title
              if q not in seen_q: seen_q.add(q); queries.append(q)
          for q in ['竹取飛翔','Taketori Hishou','Flight of the Bamboo Cutter','Help me, ERINNNNNN!!','Silver Forest Tsurupettan']:
              if q not in seen_q: seen_q.add(q); queries.append(q)

          api=OsuApi.from_env(); api.token()
          discovered={}; qhits=defaultdict(set)
          def run_query(q):
              return q,list(api.search(q,max_pages=1))
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(run_query,q) for q in queries]
              for f in as_completed(futures):
                  q,rows=f.result()
                  for raw in rows:
                      i=int(raw['id']); discovered[i]=raw; qhits[i].add(q)

          preliminary={}
          for i,raw in discovered.items():
              matches=source_matches(raw.get('artist',''),raw.get('title',''))
              if matches: preliminary[i]=(raw,matches)

          def direct(item):
              i,(search_raw,_)=item
              try:
                  raw=api.beatmapset(i)
              except Exception as exc:
                  return {'beatmapset_id':i,'error':f'{type(exc).__name__}:{exc}'}
              # Hard round-trip invariant: an ID is never reported if the live search and direct
              # endpoint disagree on the identity of the set.
              assert int(raw['id'])==i
              assert raw.get('artist','')==search_raw.get('artist',''), (i,search_raw.get('artist'),raw.get('artist'))
              assert raw.get('title','')==search_raw.get('title',''), (i,search_raw.get('title'),raw.get('title'))
              entry=entry_from_osu(raw,evidence=['audit:lunatic-princess'],confidence='candidate')
              return {'beatmapset_id':i,'entry':entry,'matches':source_matches(entry.artist,entry.title)}
          with ThreadPoolExecutor(max_workers=8) as pool:
              direct_rows=list(pool.map(direct,preliminary.items()))

          catalog=Catalog.load(Path('data/catalog.json'))
          coverage=Counter(); review=[]; errors=[]; accepted_hits=[]
          for row in direct_rows:
              i=row['beatmapset_id']
              if 'error' in row:
                  errors.append(row); continue
              e=row['entry']; matches=row['matches']
              if not matches: continue
              cur=catalog.entries.get(i)
              if cur is None:
                  state='absent'; coverage['absent']+=1
              elif cur.confidence in {'verified','probable'}:
                  state=cur.confidence; coverage['already_accepted']+=1
                  accepted_hits.append(i); continue
              else:
                  state=cur.confidence; coverage[f'existing_{state}']+=1
              review.append({
                  'beatmapset_id':i,'catalog_state':state,'artist':e.artist,'title':e.title,'creator':e.creator,
                  'source':e.source,'status':e.status,'modes':e.modes,'classifier_confidence':e.confidence,
                  'explicit_touhou_source':is_explicit_touhou_source(e.source),'matches':matches,'queries':sorted(qhits[i])
              })
          review.sort(key=lambda x:(x['catalog_state']!='absent',x['beatmapset_id']))
          print('LUNATIC_CORRECTED_SEARCH_BEGIN')
          print(json.dumps({
              'corpus_tuples':len(CORPUS),'queries':len(queries),'search_discovered_unique':len(discovered),
              'source_matched_after_search':len(preliminary),'coverage':dict(coverage),'direct_errors':errors,
              'already_accepted_source_matches':len(accepted_hits),'review_count':len(review),'review':review
          },ensure_ascii=False,indent=2))
          print('LUNATIC_CORRECTED_SEARCH_END')
          PY
