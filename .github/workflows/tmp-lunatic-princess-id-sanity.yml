name: Temporary Lunatic Princess osu search ID sanity

on:
  pull_request:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert search beatmapset IDs round-trip exactly
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from touhou_osu.osu_api import OsuApi

          QUERIES = [
              'Help me, ERINNNNNN!!',
              '竹取飛翔',
              'Silver Forest Lunatic Beat',
              'nmk sola',
              'GET IN THE RING Moonscraper',
          ]
          api = OsuApi.from_env(); api.token()
          report=[]
          for query in QUERIES:
              rows=api.search(query,max_pages=1)[:5]
              qrows=[]
              for raw in rows:
                  beatmapset_id=int(raw['id'])
                  direct=api.beatmapset(beatmapset_id)
                  item={
                      'query':query,
                      'search_id':beatmapset_id,
                      'search_artist':raw.get('artist',''),
                      'search_title':raw.get('title',''),
                      'direct_id':int(direct['id']),
                      'direct_artist':direct.get('artist',''),
                      'direct_title':direct.get('title',''),
                      'raw_keys':sorted(raw.keys()),
                  }
                  item['id_equal']=item['search_id']==item['direct_id']
                  item['artist_equal']=item['search_artist']==item['direct_artist']
                  item['title_equal']=item['search_title']==item['direct_title']
                  qrows.append(item)
                  assert item['id_equal'], item
                  assert item['artist_equal'], item
                  assert item['title_equal'], item
              report.append({'query':query,'rows':qrows})
          print('OSU_SEARCH_ID_SANITY_BEGIN')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          print('OSU_SEARCH_ID_SANITY_END')
          PY
