name: Artist Pack Wave 2 Apply

on:
  push:
    branches: [feat/artist-packs-wave2-audit]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply audited source decisions
        run: python3 tools/_wave2_apply.py
      - name: Isolate the missing-ID regression fixture
        run: python3 tools/_wave2_fix_fixture.py
      - name: Unit tests and generated exports
        run: |
          make check
          make build
      - name: Verify exact live artist-pack allowlists
        run: python3 tools/_wave2_verify.py live
      - name: Audit every configured live source
        run: python3 -m touhou_osu audit-sources --json
      - name: Simulate complete source merge
        run: python3 -m touhou_osu import-seeds
      - name: Verify sticky exclusions after merge
        run: python3 tools/_wave2_verify.py post-import
      - name: Commit formal changes and remove temporary audit tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- data/catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/catalog.json")
          catalog = json.loads(path.read_text(encoding="utf-8"))
          item = next(x for x in catalog["entries"] if int(x["beatmapset_id"]) == 605290)
          if item["confidence"] != "verified" or "tournament:1432" not in item["evidence"]:
              raise SystemExit("605290 baseline changed before final targeted correction")
          item["evidence"] = sorted(set(item["evidence"]) | {"manual:excluded"}, key=str.casefold)
          item["confidence"] = "excluded"
          path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git rm .github/workflows/artist-pack-wave2-audit.yml
          git rm .github/workflows/artist-pack-wave2-inventory.yml
          git rm .github/workflows/artist-pack-wave2-apply.yml
          git rm tools/_wave2_apply.py
          git rm tools/_wave2_verify.py
          git rm tools/_wave2_fix_fixture.py
          git add config/seeds.json touhou_osu/sources.py touhou_osu/classifier.py tests/test_sources.py tests/test_classifier.py data/catalog.json SOURCES.md docs/source-audit-2026-08-artist-packs-wave2.md
          git commit -m "feat: add audited Touhou artist pack sources"
          git push origin HEAD:feat/artist-packs-wave2-audit
