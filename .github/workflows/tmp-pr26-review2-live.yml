name: PR26 Review 2 - live source and metadata

on:
  pull_request:

permissions:
  contents: read

jobs:
  live-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refetch all 16 and recheck official pack
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.models import normalize_mode
          from touhou_osu.osu_api import OsuApi
          from touhou_osu.sources import import_official_pack

          IDS={2626,5346,507416,2188045,2205747,2209334,2282709,2314117,2561367,21098,47754,171239,183267,427407,723024,855735}
          EXPLICIT={21098,47754,855735,2205747,2282709,2561367}
          PACK={2626}
          MANUAL={5346,507416,171239,183267,427407,723024,2188045,2209334,2314117}
          c=Catalog.load(Path('data/catalog.json'))
          api=OsuApi.from_env(); api.token()
          def fetch(i): return i,api.beatmapset(i)
          with ThreadPoolExecutor(max_workers=8) as pool:
              rows=list(pool.map(fetch,sorted(IDS)))
          mismatches=[]
          for i,raw in rows:
              assert int(raw['id'])==i
              e=c.entries[i]
              live={
                  'artist':raw.get('artist',''),
                  'title':raw.get('title',''),
                  'creator':raw.get('creator',''),
                  'source':raw.get('source',''),
                  'status':raw.get('status','unknown'),
                  'modes':sorted({normalize_mode(b.get('mode','')) for b in raw.get('beatmaps',[]) if b.get('mode')}),
                  'osu_last_updated':raw.get('last_updated'),
              }
              persisted=e.to_dict()
              for key,val in live.items():
                  if persisted[key]!=val: mismatches.append((i,key,persisted[key],val))
              if i in EXPLICIT:
                  assert is_explicit_touhou_source(raw.get('source','')), (i,raw.get('source'))
                  assert 'osu_source' in e.evidence
              if i in MANUAL:
                  assert 'manual:verified' in e.evidence
              if i in PACK:
                  assert 'official_pack_item:A23' in e.evidence
          assert not mismatches, mismatches

          seeds=json.loads(Path('config/seeds.json').read_text(encoding='utf-8'))
          a23=[x for x in seeds['official_packs'] if x.get('tag')=='A23']
          assert len(a23)==1
          imported=import_official_pack(a23[0])
          assert len(imported)==30, len(imported)
          assert 2626 in {e.beatmapset_id for e in imported}
          assert all(e.confidence=='verified' for e in imported)
          print('PR26_REVIEW2_LIVE_OK')
          print('direct_refetched:',len(rows),'metadata_mismatches:',len(mismatches),'a23_members:',len(imported))
          PY
