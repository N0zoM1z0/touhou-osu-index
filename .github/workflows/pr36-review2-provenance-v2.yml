name: PR36 review 2 v2 - provenance audit

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-review2-provenance-v2.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-audit composition provenance and contradictions
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations

          import collections
          import unicodedata
          import urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path

          from touhou_osu.catalog import Catalog
          from touhou_osu.http import get_json, get_text
          from touhou_osu.provenance import (
              TOUHOUDb_API,
              _song_type,
              _touhoudb_artists,
              _touhoudb_names,
              artist_matches,
              audit_entries,
          )

          CHRONICLE_BAD_APPLE = "https://touhou.arrangement-chronicle.com/original_song/%E6%9D%B1%E6%96%B9%E5%B9%BB%E6%83%B3%E9%83%B7/Bad%20Apple!!"
          CHRONICLE_STATS = "https://touhou.arrangement-chronicle.com/statistics/original_songs"
          ZUN_THEMES = {
              "U.N.オーエンは彼女なのか？": ["U.N.オーエンは彼女なのか？", "U.N.オーエンは彼女なのか", "U.N. Owen Was Her?", "U.N. Owen Was Her"],
              "亡き王女の為のセプテット": ["亡き王女の為のセプテット", "Septette for the Dead Princess"],
              "恋色マスタースパーク": ["恋色マスタースパーク", "Love-colored Master Spark", "Love Colored Master Spark", "Love-Coloured Master Spark", "Love Coloured Master Spark"],
              "ネクロファンタジア": ["ネクロファンタジア", "Necrofantasia", "Necro Fantasia"],
              "おてんば恋娘": ["おてんば恋娘", "Beloved Tomboyish Girl"],
              "ハルトマンの妖怪少女": ["ハルトマンの妖怪少女", "Hartmann's Youkai Girl", "Hartmann Youkai Girl", "Hartmanns Youkai Girl"],
              "月まで届け、不死の煙": ["月まで届け、不死の煙", "Reach for the Moon, Immortal Smoke", "Reach for the Moon Immortal Smoke", "Reach for the Moon ~ Immortal Smoke"],
          }
          OFFICIAL_TITLES = {
              "Bad Apple!! feat.nomico",
              "Bad Apple!! feat.nomico (Animelo Summer Live 2010 Edit)",
              "Bad Apple!! feat.nomico (2014 REFIX)",
              "Bad Apple!! feat.nomico (博麗神社うた祭 2016 Edit)",
              "Bad Apple!! feat.nomico (Instrumental)",
              "Bad Apple!! feat.nomico (Graphtech Remix)",
              "Bad Apple!! feat.nomico (SIMIAN NOISE REMIX)",
              "Bad Apple!! feat.nomico (REDALiCE Remix)",
              "Bad Apple!! feat.nomico (Nardis Remix)",
              "Bad Apple!! feat.nomico (Tracy vs. Astronomical Remix)",
              "Bad Apple!! feat.nomico (Nhato Remix)",
              "Bad Apple!! feat.nomico (Camellia's Bad Psy!! Remix)",
              "Bad Apple!! feat.nomico (MK Remix)",
              "Bad Apple!! feat.nomico (ZYTOKINE Remix)",
              "Bad Apple!! feat.nomico (HYPER RAVE Remix)",
              "Bad Apple!! feat.nomico (ELEMENTAS Remix)",
              "Bad Apple!! feat.nomico (COOL&CREATE Ver.)",
              "Bad Apple!! feat.nomico (豚乙女 Ver.)",
              "Bad Apple!! feat.nomico (Marasy Ver.)",
              "Bad Apple!! feat.nomico (ARM×狐夢想 Remix)",
              "Bad Apple!! feat.nomico (Marasy + Masayoshi Minoshima)",
              "Bad Apple!! feat.nomico (TOS Remix)",
          }
          PARENT_ARTISTS = ("Alstroemeria Records", "nomico", "Masayoshi Minoshima")

          def compact(value: str) -> str:
              value = unicodedata.normalize("NFKC", str(value)).casefold()
              return "".join(ch for ch in value if ch.isalnum())

          class TableParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_tr=False; self.in_td=False; self.cell=[]; self.row=[]; self.rows=[]
              def handle_starttag(self, tag, attrs):
                  if tag == "tr": self.in_tr=True; self.row=[]
                  elif tag == "td" and self.in_tr: self.in_td=True; self.cell=[]
              def handle_data(self, data):
                  if self.in_td: self.cell.append(data)
              def handle_endtag(self, tag):
                  if tag == "td" and self.in_td:
                      self.row.append(" ".join(" ".join(self.cell).split())); self.in_td=False
                  elif tag == "tr" and self.in_tr:
                      if self.row: self.rows.append(self.row)
                      self.in_tr=False

          base = Catalog.load(Path("/tmp/pr36-base/data/catalog"))
          cur = Catalog.load(Path("data/catalog"))
          new = [cur.entries[bid] for bid in sorted(set(cur.entries) - set(base.entries))]
          bad = [e for e in new if e.original_themes == ["Bad Apple!!"]]
          zun = [e for e in new if e.original_themes != ["Bad Apple!!"]]
          assert (len(bad), len(zun)) == (230, 126), (len(bad), len(zun))

          # A. Live Arrangement Chronicle exact title + named identity for all 230.
          chronicle = collections.defaultdict(list)
          parsed_rows = 0
          for page_num in range(1, 11):
              parser = TableParser(); parser.feed(get_text(CHRONICLE_BAD_APPLE + f"?page={page_num}&per=50"))
              for row in parser.rows:
                  if len(row) < 8: continue
                  circle, title = row[1].strip(), row[2].strip()
                  vocalist = row[4].strip() if len(row) > 4 else ""
                  arranger = row[5].strip() if len(row) > 5 else ""
                  originals = row[7].strip() if len(row) > 7 else ""
                  if not title or "badapple" not in compact(originals): continue
                  identities = [v for v in (circle, vocalist, arranger) if v]
                  if identities:
                      chronicle[compact(title)].append((title, identities, originals)); parsed_rows += 1
          assert parsed_rows >= 450, parsed_rows
          missing = []
          for e in bad:
              rows = chronicle.get(compact(e.title), [])
              if not any(any(artist_matches(e.artist, identity) for identity in identities) for _, identities, _ in rows):
                  missing.append((e.beatmapset_id, e.artist, e.title))
          assert not missing, f"Chronicle identity failures: {missing[:20]}"

          # B. Evidence claims themselves must be internally consistent with the
          # first-party title corpus reviewed independently outside this runner.
          official_keys = {compact(x) for x in OFFICIAL_TITLES}
          parent_keys = tuple(compact(x) for x in PARENT_ARTISTS)
          first_party_claims = parent_claims = thb_claims = 0
          for e in bad:
              ev = set(e.evidence)
              if "primary:alstroemeria-records" in ev:
                  first_party_claims += 1
                  assert compact(e.title) in official_keys, (e.beatmapset_id, e.title)
              if "primary:bad-apple-parent-identity" in ev:
                  parent_claims += 1
                  ak = compact(e.artist)
                  assert any(k and k in ak for k in parent_keys), (e.beatmapset_id, e.artist)
              if "provenance:thbwiki" in ev:
                  thb_claims += 1
          assert (first_party_claims, parent_claims, thb_claims) == (96, 207, 130), (first_party_claims, parent_claims, thb_claims)

          # C. Re-run THBWiki/TouhouDB for every Bad Apple row. Explicit
          # contradictions/ambiguity are merge blockers. Existing THBWiki claims
          # must still resolve to positive THBWiki support.
          audits = audit_entries(bad, workers=8)
          by_id = {a.beatmapset_id: a for a in audits}
          contradictions = []
          provider_errors = []
          for e in bad:
              a = by_id[e.beatmapset_id]
              if a.verdict in {"red_flag", "ambiguous"}:
                  contradictions.append((e.beatmapset_id, a.verdict, [h.to_dict() for h in a.hits]))
              if "provenance:thbwiki" in set(e.evidence):
                  assert a.verdict == "supported", (e.beatmapset_id, a.verdict, a.errors)
                  assert any(h.provider == "thbwiki" for h in a.supports), (e.beatmapset_id, [h.to_dict() for h in a.hits])
              if a.errors:
                  provider_errors.append((e.beatmapset_id, a.errors))
          assert not contradictions, f"external contradiction(s): {contradictions[:10]}"
          # Provider errors are not silently ignored for claimed THBWiki rows;
          # those already failed above. Print any advisory errors for inspection.

          # D. ZUN class: live Arrangement Chronicle must still list every theme;
          # TouhouDB independently confirms each controlled theme as an Original
          # by ZUN. Use all aliases as lookup attempts to avoid language-key bias.
          stats_key = compact(get_text(CHRONICLE_STATS))
          confirmed = set()
          for canonical, aliases in ZUN_THEMES.items():
              assert compact(canonical) in stats_key, f"Chronicle missing {canonical}"
              found = False
              for query in [canonical] + aliases:
                  params = urllib.parse.urlencode({
                      "query": query,
                      "nameMatchMode": "Exact",
                      "fields": "Artists,AdditionalNames,Albums",
                      "maxResults": "30",
                      "getTotalCount": "true",
                  })
                  payload = get_json(f"{TOUHOUDb_API}?{params}")
                  for item in payload.get("items", []) if isinstance(payload, dict) else []:
                      names = {compact(name) for name in _touhoudb_names(item)}
                      if not names.intersection({compact(x) for x in [canonical] + aliases}): continue
                      artists = _touhoudb_artists(item)
                      if not any(compact(a) == "zun" for a in artists): continue
                      if _song_type(item).casefold() != "original": continue
                      found = True; break
                  if found: break
              assert found, f"TouhouDB did not confirm ZUN original: {canonical}"
              confirmed.add(canonical)

          for e in zun:
              canonical = e.original_themes[0]
              assert canonical in confirmed, (e.beatmapset_id, canonical)
              assert compact(e.artist) == "zun", (e.beatmapset_id, e.artist)
              assert compact(e.title) in {compact(x) for x in ZUN_THEMES[canonical]}, (e.beatmapset_id, canonical, e.title)

          print("REVIEW 2 V2 PASS")
          print(f"chronicle_rows={parsed_rows} bad_exact_identity={len(bad)}/{len(bad)}")
          print(f"bad_external_audits={len(audits)} contradictions={len(contradictions)} provider_errors={len(provider_errors)}")
          print(f"first_party_claims={first_party_claims} parent_claims={parent_claims} thb_claims={thb_claims}")
          print(f"zun_rows={len(zun)} touhoudb_confirmed_themes={len(confirmed)}")
          if provider_errors:
              print("ADVISORY PROVIDER ERRORS", provider_errors[:20])
          PY
