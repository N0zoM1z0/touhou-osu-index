name: Artist Pack Wave 2 Audit

on:
  push:
    branches: [feat/artist-packs-wave2-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect live pack and beatmap metadata
        run: |
          python3 - <<'PY'
          import json
          import time
          from collections import Counter
          from pathlib import Path

          from touhou_osu.classifier import contains_any, is_explicit_touhou_source, TOUHOU_TAG_TOKENS
          from touhou_osu.http import get_text
          from touhou_osu.sources import import_official_pack, parse_beatmapset_page

          packs = [
              {"tag": "A51", "name": "Rin Pack", "expected": 13},
              {"tag": "A18", "name": "Demetori Pack", "expected": 23},
              {"tag": "A33", "name": "FELT Pack", "expected": 11},
              {"tag": "A32", "name": "Halozy Pack", "expected": 11},
              {"tag": "A16", "name": "Yuuhei Satellite Pack", "expected": 34},
              {"tag": "A85", "name": "Yuuhei Satellite & Shoujo Fractal Pack 2", "expected": 22},
              {"tag": "A86", "name": "Yuuhei Satellite & Shoujo Fractal Pack 3", "expected": 22},
              {"tag": "A87", "name": "Yuuhei Satellite & Shoujo Fractal Pack 4", "expected": 22},
              {"tag": "A23", "name": "Silver Forest Pack", "expected": 30},
          ]

          catalog = json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          by_id = {int(item["beatmapset_id"]): item for item in catalog["entries"]}
          output = {"packs": []}

          for pack in packs:
              imported = import_official_pack(pack)
              if len(imported) != pack["expected"]:
                  raise SystemExit(f"{pack['tag']} count changed: {len(imported)} != {pack['expected']}")
              rows = []
              for idx, item in enumerate(imported, 1):
                  page = parse_beatmapset_page(get_text(f"https://osu.ppy.sh/beatmapsets/{item.beatmapset_id}"))
                  source = str(page.get("source") or "")
                  tags = str(page.get("tags") or "")
                  explicit_source = is_explicit_touhou_source(source)
                  touhou_tags = contains_any(tags, TOUHOU_TAG_TOKENS)
                  current = by_id.get(item.beatmapset_id, {})
                  rows.append({
                      "beatmapset_id": item.beatmapset_id,
                      "pack_artist": item.artist,
                      "pack_title": item.title,
                      "osu_artist": page.get("artist", ""),
                      "osu_title": page.get("title", ""),
                      "source": source,
                      "tags": tags,
                      "status": page.get("status", "unknown"),
                      "explicit_touhou_source": explicit_source,
                      "touhou_tag": touhou_tags,
                      "current_confidence": current.get("confidence", "missing"),
                      "current_evidence": current.get("evidence", []),
                  })
                  if idx % 10 == 0:
                      time.sleep(0.2)
              bucket = Counter(
                  "explicit_source" if r["explicit_touhou_source"] else
                  "touhou_tag" if r["touhou_tag"] else
                  "ambiguous"
                  for r in rows
              )
              print(pack["tag"], len(rows), dict(bucket))
              output["packs"].append({**pack, "summary": dict(bucket), "entries": rows})

          Path("wave2-artist-pack-audit.json").write_text(
              json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Run baseline tests
        run: |
          make check
          make build
      - uses: actions/upload-artifact@v4
        with:
          name: wave2-artist-pack-audit
          path: wave2-artist-pack-audit.json
