name: PR36 final review 2 - provenance

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-final-review2-provenance.yml

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct full composition provenance from live sources
        run: |
          rm -rf /tmp/pr36-base
          mkdir -p /tmp/pr36-base
          git archive --format=tar origin/main data/catalog | tar -xf - -C /tmp/pr36-base
          python - <<'PY'
          from __future__ import annotations
          import collections, unicodedata, urllib.parse
          from html.parser import HTMLParser
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.http import get_json, get_text
          from touhou_osu.provenance import TOUHOUDb_API, _song_type, _touhoudb_artists, _touhoudb_names, artist_matches, audit_entries

          BAD_URL='https://touhou.arrangement-chronicle.com/original_song/%E6%9D%B1%E6%96%B9%E5%B9%BB%E6%83%B3%E9%83%B7/Bad%20Apple!!'
          STATS_URL='https://touhou.arrangement-chronicle.com/statistics/original_songs'
          ZUN_ALIASES={
              'U.N.オーエンは彼女なのか？':['U.N.オーエンは彼女なのか？','U.N.オーエンは彼女なのか','U.N. Owen Was Her?','U.N. Owen Was Her'],
              '亡き王女の為のセプテット':['亡き王女の為のセプテット','Septette for the Dead Princess'],
              '恋色マスタースパーク':['恋色マスタースパーク','Love-colored Master Spark','Love Colored Master Spark','Love-Coloured Master Spark','Love Coloured Master Spark'],
              'ネクロファンタジア':['ネクロファンタジア','Necrofantasia','Necro Fantasia'],
              'おてんば恋娘':['おてんば恋娘','Beloved Tomboyish Girl'],
              'ハルトマンの妖怪少女':['ハルトマンの妖怪少女',"Hartmann's Youkai Girl",'Hartmann Youkai Girl','Hartmanns Youkai Girl'],
              '月まで届け、不死の煙':['月まで届け、不死の煙','Reach for the Moon, Immortal Smoke','Reach for the Moon Immortal Smoke','Reach for the Moon ~ Immortal Smoke'],
          }
          OFFICIAL_TITLES={
              'Bad Apple!! feat.nomico','Bad Apple!! feat.nomico (Animelo Summer Live 2010 Edit)','Bad Apple!! feat.nomico (2014 REFIX)','Bad Apple!! feat.nomico (博麗神社うた祭 2016 Edit)','Bad Apple!! feat.nomico (Instrumental)','Bad Apple!! feat.nomico (Graphtech Remix)','Bad Apple!! feat.nomico (SIMIAN NOISE REMIX)','Bad Apple!! feat.nomico (REDALiCE Remix)','Bad Apple!! feat.nomico (Nardis Remix)','Bad Apple!! feat.nomico (Tracy vs. Astronomical Remix)','Bad Apple!! feat.nomico (Nhato Remix)',"Bad Apple!! feat.nomico (Camellia's Bad Psy!! Remix)",'Bad Apple!! feat.nomico (MK Remix)','Bad Apple!! feat.nomico (ZYTOKINE Remix)','Bad Apple!! feat.nomico (HYPER RAVE Remix)','Bad Apple!! feat.nomico (ELEMENTAS Remix)','Bad Apple!! feat.nomico (COOL&CREATE Ver.)','Bad Apple!! feat.nomico (豚乙女 Ver.)','Bad Apple!! feat.nomico (Marasy Ver.)','Bad Apple!! feat.nomico (ARM×狐夢想 Remix)','Bad Apple!! feat.nomico (Marasy + Masayoshi Minoshima)','Bad Apple!! feat.nomico (TOS Remix)'
          }
          PARENTS=('Alstroemeria Records','nomico','Masayoshi Minoshima')
          def compact(v):
              v=unicodedata.normalize('NFKC',str(v)).casefold()
              return ''.join(ch for ch in v if ch.isalnum())
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.tr=False; self.td=False; self.cell=[]; self.row=[]; self.rows=[]
              def handle_starttag(self,t,a):
                  if t=='tr': self.tr=True; self.row=[]
                  elif t=='td' and self.tr: self.td=True; self.cell=[]
              def handle_data(self,d):
                  if self.td: self.cell.append(d)
              def handle_endtag(self,t):
                  if t=='td' and self.td: self.row.append(' '.join(' '.join(self.cell).split())); self.td=False
                  elif t=='tr' and self.tr:
                      if self.row: self.rows.append(self.row)
                      self.tr=False

          base=Catalog.load(Path('/tmp/pr36-base/data/catalog'))
          cur=Catalog.load(Path('data/catalog'))
          new=[cur.entries[i] for i in sorted(set(cur.entries)-set(base.entries))]
          bad=[e for e in new if 'provenance:arrangement-chronicle-bad-apple' in set(e.evidence)]
          zun=[e for e in new if 'identity:zun-exact-original-title' in set(e.evidence)]
          assert (len(bad),len(zun))==(230,126)

          # Live original-song registry -> canonical theme/game dictionary.
          theme_game={}
          stats_text=''
          for page in range(1,14):
              html=get_text(STATS_URL+f'?page={page}&per=50'); stats_text+=html
              p=P(); p.feed(html)
              for row in p.rows:
                  if len(row)>=3 and row[0].strip().isdigit():
                      theme=row[1].strip(); game=row[2].strip()
                      if theme and game: theme_game[compact(theme)]=(theme,game)
          assert len(theme_game)>=600, len(theme_game)

          # Live Bad Apple corpus. For each exact title+identity match, retain
          # every original named by the source. Unioning matching rows is
          # intentional: different releases of the same recording can expose a
          # fuller original-song list (e.g. Bad Apple & Good Orange).
          corpus=collections.defaultdict(list); parsed=0
          for page in range(1,11):
              p=P(); p.feed(get_text(BAD_URL+f'?page={page}&per=50'))
              for row in p.rows:
                  if len(row)<8: continue
                  circle,title=row[1].strip(),row[2].strip()
                  vocal=row[4].strip() if len(row)>4 else ''
                  arranger=row[5].strip() if len(row)>5 else ''
                  cell=row[7].strip() if len(row)>7 else ''
                  if not title or 'badapple' not in compact(cell): continue
                  identities=[x for x in (circle,vocal,arranger) if x]
                  supported=[]
                  for _,(theme,game) in theme_game.items():
                      if theme in cell: supported.append((theme,game))
                  if identities and supported:
                      corpus[compact(title)].append((identities,supported,cell)); parsed+=1
          assert parsed>=450, parsed

          mismatches=[]; mixed_count=0
          for e in bad:
              rows=[r for r in corpus.get(compact(e.title),[]) if any(artist_matches(e.artist,x) for x in r[0])]
              if not rows:
                  mismatches.append((e.beatmapset_id,'no exact title+identity row')); continue
              themes=sorted({theme for _,supported,_ in rows for theme,_ in supported},key=str.casefold)
              games={compact(game) for _,supported,_ in rows for _,game in supported}
              stored_games={compact(game) for game in e.origin_games}
              if themes!=e.original_themes: mismatches.append((e.beatmapset_id,'themes',e.original_themes,themes))
              if games!=stored_games: mismatches.append((e.beatmapset_id,'games',e.origin_games,sorted(games)))
              expected_kind='mixed' if len(themes)>1 else 'arrangement'
              if e.touhou_kind!=expected_kind: mismatches.append((e.beatmapset_id,'kind',e.touhou_kind,expected_kind))
              mixed_count+=int(expected_kind=='mixed')
          assert not mismatches, f'composition-structure mismatch: {mismatches[:20]}'
          assert mixed_count==1, mixed_count

          # Re-run advisory external providers over all Bad Apple rows. Provider
          # transport errors are reported but do not erase the primary Chronicle
          # proof; any actual contradictory result is a hard failure.
          audits=audit_entries(bad,workers=8)
          contradictions=[]; provider_errors=[]
          for a in audits:
              if a.verdict in {'red_flag','ambiguous'}: contradictions.append((a.beatmapset_id,a.verdict,[h.to_dict() for h in a.hits]))
              if a.errors: provider_errors.append((a.beatmapset_id,a.errors))
          assert not contradictions, contradictions[:10]

          # Verify first-party evidence labels are restricted to the reviewed
          # official Alstroemeria title corpus; live first-party page content is
          # checked independently in the manual review.
          official_keys={compact(x) for x in OFFICIAL_TITLES}; parent_keys=tuple(compact(x) for x in PARENTS)
          first_party=parent_claims=0
          for e in bad:
              ev=set(e.evidence)
              if 'primary:alstroemeria-records' in ev:
                  first_party+=1; assert compact(e.title) in official_keys, (e.beatmapset_id,e.title)
              if 'primary:bad-apple-parent-identity' in ev:
                  parent_claims+=1; ak=compact(e.artist); assert any(k and k in ak for k in parent_keys), (e.beatmapset_id,e.artist)
          assert (first_party,parent_claims)==(96,207), (first_party,parent_claims)

          # Independent TouhouDB confirmation for all seven ZUN original theme
          # families, then exact controlled alias validation for all 126 rows.
          confirmed=set()
          for canonical,aliases in ZUN_ALIASES.items():
              assert compact(canonical) in compact(stats_text), canonical
              target_keys={compact(x) for x in [canonical]+aliases}; found=False
              for query in [canonical]+aliases:
                  params=urllib.parse.urlencode({'query':query,'nameMatchMode':'Exact','fields':'Artists,AdditionalNames,Albums','maxResults':'30','getTotalCount':'true'})
                  payload=get_json(f'{TOUHOUDb_API}?{params}')
                  for item in payload.get('items',[]) if isinstance(payload,dict) else []:
                      if not target_keys.intersection({compact(n) for n in _touhoudb_names(item)}): continue
                      if not any(compact(a)=='zun' for a in _touhoudb_artists(item)): continue
                      if _song_type(item).casefold()!='original': continue
                      found=True; break
                  if found: break
              assert found, f'TouhouDB did not confirm {canonical}'
              confirmed.add(canonical)
          for e in zun:
              canonical=e.original_themes[0]
              assert canonical in confirmed
              assert compact(e.artist)=='zun'
              assert compact(e.title) in {compact(x) for x in ZUN_ALIASES[canonical]}, (e.beatmapset_id,canonical,e.title)

          print('FINAL REVIEW 2 PASS')
          print(f'bad_exact_structured={len(bad)}/{len(bad)} mixed={mixed_count} chronicle_rows={parsed}')
          print(f'advisory_audits={len(audits)} contradictions={len(contradictions)} provider_errors={len(provider_errors)}')
          print(f'first_party_claims={first_party} parent_claims={parent_claims}')
          print(f'zun_rows={len(zun)} touhoudb_confirmed_themes={len(confirmed)}')
          if provider_errors: print('ADVISORY_PROVIDER_ERRORS',provider_errors[:20])
          PY
