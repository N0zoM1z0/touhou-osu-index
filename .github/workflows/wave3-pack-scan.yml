name: Wave 3 Official Pack Scan

on:
  push:
    branches: [feat/official-packs-wave3-scan]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl official pack indexes and measure Touhou intersections
        run: |
          python3 - <<'PY'
          import html
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          from touhou_osu.sources import parse_beatmap_links

          TARGET_ARTISTS = {
              "a-one", "adust rain", "blankfield", "down", "hamu", "innocent key",
              "kanpyohgo", "knife", "minstrel", "nekodex", "shibayanrecords",
              "takamachi walk", "tsunamix", "undead corporation",
              "yuuhei satellite", "senya", "rin", "function phantom",
          }
          TOUHOU_EVIDENCE_PREFIXES = (
              "official_pack:", "official_pack_item:", "tournament:", "tmc:",
          )

          def fetch(url: str) -> str:
              req = urllib.request.Request(url, headers={"User-Agent": "touhou-osu-index-source-audit/1"})
              delay = 1.0
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as response:
                          return response.read().decode("utf-8", errors="replace")
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (429, 502, 503, 504) or attempt == 7:
                          raise
                      time.sleep(delay)
                      delay = min(delay * 2, 20)
              raise RuntimeError(url)

          def pack_title(text: str, tag: str) -> str:
              match = re.search(r"<title>(.*?)</title>", text, re.I | re.S)
              if not match:
                  return tag
              title = html.unescape(re.sub(r"\s+", " ", match.group(1))).strip()
              return title.split(" · ", 1)[0].strip() or tag

          def collect_tags(pack_type: str, prefix: str) -> list[str]:
              seen = set()
              no_new_pages = 0
              tag_re = re.compile(r"packs(?:/|\\/)" + re.escape(prefix) + r"(\d+)")
              for page in range(1, 80):
                  text = fetch(f"https://osu.ppy.sh/beatmaps/packs?type={pack_type}&page={page}")
                  tags = {prefix + number for number in tag_re.findall(text)}
                  new = tags - seen
                  if new:
                      seen.update(new)
                      no_new_pages = 0
                  else:
                      no_new_pages += 1
                  if no_new_pages >= 2:
                      break
                  time.sleep(0.15)
              if not seen:
                  raise RuntimeError(f"failed to extract any {prefix} pack tags from type={pack_type}")
              return sorted(seen, key=lambda value: int(re.search(r"\d+", value).group()))

          catalog = json.loads(Path("data/catalog.json").read_text(encoding="utf-8"))
          by_id = {int(item["beatmapset_id"]): item for item in catalog["entries"]}
          result = {"categories": {}, "a2": None}

          a2_text = fetch("https://osu.ppy.sh/beatmaps/packs/A2")
          a2_links = parse_beatmap_links(a2_text)
          if len(a2_links) != 7:
              raise RuntimeError(f"A2 changed: expected 7 entries, got {len(a2_links)}")
          result["a2"] = {
              "tag": "A2",
              "title": pack_title(a2_text, "A2"),
              "entries": [
                  {
                      "id": item["id"], "artist": item["artist"], "title": item["title"],
                      "catalog_confidence": by_id.get(item["id"], {}).get("confidence", "missing"),
                      "catalog_source": by_id.get(item["id"], {}).get("source", ""),
                      "catalog_evidence": by_id.get(item["id"], {}).get("evidence", []),
                  }
                  for item in a2_links
              ],
          }
          print("A2", len(a2_links), [(x["id"], x["artist"], x["title"]) for x in a2_links])

          for pack_type, prefix in (("featured", "F"), ("chart", "R")):
              tags = collect_tags(pack_type, prefix)
              print(pack_type, "pack_count", len(tags), "range", (tags[0], tags[-1]))
              candidates = []
              for index, tag in enumerate(tags, 1):
                  text = fetch(f"https://osu.ppy.sh/beatmaps/packs/{tag}")
                  links = parse_beatmap_links(text)
                  rows = []
                  for item in links:
                      current = by_id.get(item["id"])
                      artist_key = item["artist"].casefold().strip()
                      target_artist = artist_key in TARGET_ARTISTS or any(
                          token in artist_key for token in TARGET_ARTISTS if len(token) >= 5
                      )
                      touhou_evidence = False
                      if current:
                          evidence = current.get("evidence", [])
                          touhou_evidence = current.get("confidence") == "verified" or any(
                              ev == "manual:verified" or ev == "osu_source" or ev.startswith(TOUHOU_EVIDENCE_PREFIXES)
                              for ev in evidence
                          )
                      if target_artist or touhou_evidence:
                          rows.append({
                              "id": item["id"], "artist": item["artist"], "title": item["title"],
                              "target_artist": target_artist,
                              "catalog_confidence": current.get("confidence", "missing") if current else "missing",
                              "catalog_source": current.get("source", "") if current else "",
                              "catalog_evidence": current.get("evidence", []) if current else [],
                          })
                  if rows:
                      candidates.append({
                          "tag": tag,
                          "title": pack_title(text, tag),
                          "raw_count": len(links),
                          "candidate_rows": rows,
                      })
                  if index % 25 == 0:
                      print(pack_type, "scanned", index, "/", len(tags), "candidate_packs", len(candidates))
                  time.sleep(0.2)
              result["categories"][pack_type] = {
                  "pack_count": len(tags),
                  "candidate_packs": candidates,
              }
              print(pack_type, "candidate_packs", len(candidates))

          Path("wave3-pack-scan.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave3-pack-scan
          path: wave3-pack-scan.json
