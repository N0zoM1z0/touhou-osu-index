name: Temporary Night of Knights status-scoped enumeration

on:
  pull_request:

permissions:
  contents: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enumerate Night title family across osu statuses
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,unicodedata
          from collections import defaultdict,Counter
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.osu_api import OsuApi,entry_from_osu

          QUERIES=['ナイト・オブ・ナイツ','Night of Knights','Night of Nights','Knight of Nights','Chou Night of Knights','Super Night of Nights','超ナイト・オブ・ナイツ']
          STATUSES=['graveyard','ranked','loved','qualified','pending','wip']
          def norm(v):return ''.join(c for c in unicodedata.normalize('NFKC',v or '').casefold() if c.isalnum())
          TOKENS=[norm(x) for x in ['ナイト・オブ・ナイツ','Night of Knights','Night of Nights','Knight of Nights']]
          def family(title):
              t=norm(title)
              return any(x in t for x in TOKENS)
          api=OsuApi.from_env();api.token();catalog=Catalog.load(Path('data/catalog.json'))
          def search(item):
              q,status=item;cursor=None;out=[]
              for _ in range(20):
                  params={'q':q,'s':status}
                  if cursor:params['cursor_string']=cursor
                  payload=api.get('/beatmapsets/search',params)
                  out.extend(payload.get('beatmapsets',[]))
                  cursor=payload.get('cursor_string')
                  if not cursor:break
              return q,status,out
          discovered={};origins=defaultdict(set)
          with ThreadPoolExecutor(max_workers=6) as p:
              fs=[p.submit(search,(q,s)) for s in STATUSES for q in QUERIES]
              for f in as_completed(fs):
                  q,s,rows=f.result()
                  for r in rows:
                      i=int(r['id']);discovered[i]=r;origins[i].add(f'{s}:{q}')
          prelim={i:r for i,r in discovered.items() if family(r.get('title',''))}
          def fetch(item):
              i,s=item
              try:r=api.beatmapset(i)
              except Exception as exc:return {'beatmapset_id':i,'error':f'{type(exc).__name__}:{exc}'}
              assert int(r['id'])==i
              e=entry_from_osu(r,evidence=['audit:night-status-search'],confidence='candidate')
              cur=catalog.entries.get(i)
              return {'beatmapset_id':i,'catalog_state':'absent' if cur is None else cur.confidence,
                'artist':e.artist,'title':e.title,'creator':e.creator,'source':e.source,'status':e.status,'modes':e.modes,
                'explicit_touhou_source':is_explicit_touhou_source(e.source),'classifier_confidence':e.confidence,
                'tags':r.get('tags',''),'origins':sorted(origins[i])}
          with ThreadPoolExecutor(max_workers=10) as p:rows=list(p.map(fetch,prelim.items()))
          errors=[x for x in rows if 'error'in x];valid=[x for x in rows if 'error'not in x]
          states=Counter(x['catalog_state'] for x in valid)
          missing=sorted((x for x in valid if x['catalog_state']=='absent'),key=lambda x:x['beatmapset_id'])
          print('NIGHT_STATUS_ENUM_BEGIN')
          print(json.dumps({'query_status_pairs':len(QUERIES)*len(STATUSES),'discovered_unique':len(discovered),
            'title_family_direct':len(valid),'states':dict(states),'direct_errors':errors,'missing':missing},ensure_ascii=False,indent=2))
          print('NIGHT_STATUS_ENUM_END')
          PY
