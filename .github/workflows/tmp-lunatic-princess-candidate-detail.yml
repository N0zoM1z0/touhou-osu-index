name: Temporary Lunatic Princess candidate detail audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refetch first-pass review candidates
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json
          from concurrent.futures import ThreadPoolExecutor
          from touhou_osu.osu_api import OsuApi

          IDS=[9920,22399,23914,33654,35129,39478,46406,62397,825705,876583,2410754,2411291,2428444]
          api=OsuApi.from_env(); api.token()
          def fetch(i):
              try:
                  raw=api.beatmapset(i)
              except Exception as exc:
                  return {'beatmapset_id':i,'error':f'{type(exc).__name__}:{exc}'}
              return {
                  'beatmapset_id':i,
                  'artist':raw.get('artist'),
                  'artist_unicode':raw.get('artist_unicode'),
                  'title':raw.get('title'),
                  'title_unicode':raw.get('title_unicode'),
                  'source':raw.get('source'),
                  'tags':raw.get('tags'),
                  'creator':raw.get('creator'),
                  'status':raw.get('status'),
                  'genre':(raw.get('genre') or {}).get('name'),
                  'language':(raw.get('language') or {}).get('name'),
                  'beatmaps':[{'id':b.get('id'),'version':b.get('version'),'mode':b.get('mode')} for b in raw.get('beatmaps',[])],
              }
          with ThreadPoolExecutor(max_workers=8) as p:
              rows=list(p.map(fetch,IDS))
          print('LUNATIC_CANDIDATE_DETAILS_BEGIN')
          print(json.dumps(rows,ensure_ascii=False,indent=2))
          print('LUNATIC_CANDIDATE_DETAILS_END')
          PY
