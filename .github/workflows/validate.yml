name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - run: make build

  audit-night-suspicious-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Direct-refetch suspicious mixed candidates
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from touhou_osu.osu_api import OsuApi
          IDS=[337187,1598539,1675793,1976379,2274999,2534273]
          api=OsuApi.from_env();api.token()
          for i in IDS:
              r=api.beatmapset(i);assert int(r['id'])==i
              diffs=' / '.join(sorted({b.get('version','') for b in r.get('beatmaps',[]) if b.get('version')}))
              print('SUSPICIOUS|{}|{}|{}|source={}|tags={}|diffs={}'.format(i,r.get('artist',''),r.get('title',''),r.get('source',''),r.get('tags',''),diffs))
          PY
