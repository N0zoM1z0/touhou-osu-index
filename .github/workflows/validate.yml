name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make check
      - run: make build

  apply-night-final-provenance:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply structured provenance and existing-candidate boundary
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import apply_classification
          from touhou_osu.http import HttpError
          from touhou_osu.osu_api import OsuApi,entry_from_osu

          ORIGIN_GAMES=['東方紅魔郷 ～ the Embodiment of Scarlet Devil.','東方花映塚 ～ Phantasmagoria of Flower View.']
          ORIGINAL_THEMES=['フラワリングナイト','月時計 ～ ルナ・ダイアル']
          MIXED_IDS={1528497,337187,1598539,1675793,1976379,2274999,2534273}

          base_raw=json.loads(subprocess.check_output(['git','show','origin/main:data/catalog.json'],text=True))
          base={int(x['beatmapset_id']):x for x in base_raw['entries']}
          path=Path('data/catalog.json');catalog=Catalog.load(path)
          new_ids=sorted(set(catalog.entries)-set(base))
          assert len(new_ids)==357,len(new_ids)
          for i in new_ids:
              e=catalog.entries[i]
              assert e.confidence=='verified',(i,e.confidence)
              assert 'audit:night-of-knights-2026-08' in e.evidence,(i,e.evidence)
              e.origin_games=list(ORIGIN_GAMES)
              e.original_themes=list(ORIGINAL_THEMES)
              e.touhou_kind='mixed' if i in MIXED_IDS else 'arrangement'

          target=catalog.entries[154426]
          unresolved=catalog.entries[1561908]
          assert 'manual:candidate' not in target.evidence and 'manual:excluded' not in target.evidence
          assert unresolved.confidence=='candidate' and 'manual:verified' not in unresolved.evidence

          api=OsuApi.from_env();api.token()
          raw=api.beatmapset(154426)
          assert int(raw['id'])==154426
          assert raw.get('artist')=='beatMARIO',raw.get('artist')
          assert raw.get('title')=='Night of Knights',raw.get('title')
          tags=(raw.get('tags') or '').casefold()
          assert 'touhou' in tags and ('cool&create' in tags or 'cool create' in tags),tags
          try:
              api.beatmapset(1561908)
          except HttpError as exc:
              assert 'HTTP 404' in str(exc),str(exc)
          else:
              raise AssertionError('1561908 unexpectedly resolves; requires fresh review')

          if target.confidence=='candidate':
              incoming=entry_from_osu(raw,evidence=[
                  'audit:night-of-knights-2026-08',
                  'manual:verified',
                  'composition:cool-create:night-of-knights',
                  'corroboration:cool-create:base-track',
              ],confidence='candidate')
              incoming.touhou_kind='arrangement'
              incoming.origin_games=list(ORIGIN_GAMES)
              incoming.original_themes=list(ORIGINAL_THEMES)
              incoming=apply_classification(incoming,tags=raw.get('tags',''))
              assert incoming.confidence=='verified'
              _,changed=catalog.merge(incoming);assert changed
          else:
              assert target.confidence=='verified'
              target.touhou_kind='arrangement'
              target.origin_games=list(ORIGIN_GAMES)
              target.original_themes=list(ORIGINAL_THEMES)
              for ev in ['audit:night-of-knights-2026-08','manual:verified','composition:cool-create:night-of-knights','corroboration:cool-create:base-track']:
                  if ev not in target.evidence:target.evidence.append(ev)
          catalog.save(path)

          doc_path=Path('docs/source-audit-2026-08-night-of-knights.md');doc=doc_path.read_text(encoding='utf-8')
          s='<!-- NIGHT_EXISTING_CANDIDATE_START -->';e='<!-- NIGHT_EXISTING_CANDIDATE_END -->'
          block=f'''{s}

## Existing candidate boundary

A separate scan of the pre-change catalog found two historical `candidate` entries with controlled Night-of-Knights titles that were not both represented in the 440 absent-set pool:

- `154426` — `beatMARIO - Night of Knights`. The set still resolves through the official osu! API; current artist/title remain exact, and current mapper tags include both `cool&create` and `touhou`. Combined with COOL&CREATE's first-party provenance for the parent track, this entry is upgraded to `verified` with sticky `manual:verified` evidence.
- `1561908` — historical metadata `USAO - Night of Nights (USAO Remix)`. COOL&CREATE's 2019 first-party album independently confirms that exact derivative exists, but the current osu! API returns HTTP 404 for the beatmapset. Under the conservative unresolved-link boundary, this catalog entry remains `candidate` and receives no manual override.

The separate non-family first-party recall pass searched `ナイト・オブ・ニーツ` / `Night of NEETs`, `ナイト・オブ・IQの低いナイツ` / `Night of Low IQ Nights`, and `NIGHT OF FLOWER -幻想郷最速伝説-` / `NIGHT OF FLOWER` across `graveyard`, `ranked`, `loved`, `qualified`, `pending`, and `wip`: **36 query/status pairs, zero guarded title+artist direct matches, and zero API query errors**. Therefore no extra beatmapsets are added from that recall pass.

{e}'''
          if s in doc:doc=doc[:doc.index(s)]+block+doc[doc.index(e)+len(e):]
          else:doc=doc.rstrip()+'\n\n'+block+'\n'

          s='<!-- NIGHT_STRUCTURED_PROVENANCE_START -->';e='<!-- NIGHT_STRUCTURED_PROVENANCE_END -->'
          mixed=','.join(map(str,sorted(MIXED_IDS)))
          block=f'''{s}

## Structured provenance normalization

COOL&CREATE's first-party provenance identifies the parent `ナイト・オブ・ナイツ` as an arrangement of both `フラワリングナイト` (東方花映塚) and `月時計 ～ ルナ・ダイアル` (東方紅魔郷). The final catalog pass therefore records both canonical games and both original themes on all **357 newly added derivative sets** and on the reviewed existing set `154426`.

The title/metadata review identifies **7 mixed-source derivatives** rather than pure arrangements: `{mixed}`. These include the previously identified `The kid vs DjSray` mashup plus live-metadata-confirmed McDonald's/Happy Set, Gachi, Otomad collaboration, Super Mario 64, Lucky Star, and S3RL/Bass Slut variants. Those seven use `touhou_kind: mixed`; the remaining 350 new sets and `154426` use `touhou_kind: arrangement`.

No confidence decision is changed by this normalization; it only fills structured provenance already supported by the same first-party composition chain.

{e}'''
          if s in doc:doc=doc[:doc.index(s)]+block+doc[doc.index(e)+len(e):]
          else:doc=doc.rstrip()+'\n\n'+block+'\n'
          doc_path.write_text(doc,encoding='utf-8')
          print('NIGHT_FINAL_PROVENANCE_APPLY_OK',len(new_ids),sorted(MIXED_IDS))
          PY
          make check
          make build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json docs/source-audit-2026-08-night-of-knights.md
          if git diff --cached --quiet; then
            echo "No semantic changes to commit"
          else
            git commit -m "data: complete Night of Knights provenance metadata"
          fi
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  audit-night-final:
    needs: apply-night-final-provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact catalog, live metadata, and conservative-boundary audit
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json,subprocess
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.http import HttpError
          from touhou_osu.models import normalize_mode
          from touhou_osu.osu_api import OsuApi

          ORIGIN_GAMES=['東方紅魔郷 ～ the Embodiment of Scarlet Devil.','東方花映塚 ～ Phantasmagoria of Flower View.']
          ORIGINAL_THEMES=['フラワリングナイト','月時計 ～ ルナ・ダイアル']
          MIXED_IDS={1528497,337187,1598539,1675793,1976379,2274999,2534273}

          base_raw=json.loads(subprocess.check_output(['git','show','origin/main:data/catalog.json'],text=True))
          head_raw=json.loads(Path('data/catalog.json').read_text(encoding='utf-8'))
          base={int(x['beatmapset_id']):x for x in base_raw['entries']}
          head={int(x['beatmapset_id']):x for x in head_raw['entries']}
          new_ids=sorted(set(head)-set(base))
          removed=sorted(set(base)-set(head))
          changed_old=sorted(i for i in set(base)&set(head) if base[i]!=head[i])
          assert len(base)==3632,len(base)
          assert len(head)==3989,len(head)
          assert len(new_ids)==357,len(new_ids)
          assert not removed,removed
          assert changed_old==[154426],changed_old[:20]
          assert head[1561908]==base[1561908]

          new=[head[i] for i in new_ids]
          assert all(x['confidence']=='verified' for x in new)
          assert all('audit:night-of-knights-2026-08' in x['evidence'] for x in new)
          auto=sum('osu_source' in x['evidence'] and 'manual:verified' not in x['evidence'] for x in new)
          manual=sum('manual:verified' in x['evidence'] for x in new)
          assert (auto,manual)==(177,180),(auto,manual)
          assert all(x['origin_games']==ORIGIN_GAMES for x in new)
          assert all(x['original_themes']==ORIGINAL_THEMES for x in new)
          assert {x['beatmapset_id'] for x in new if x['touhou_kind']=='mixed'}==MIXED_IDS
          assert sum(x['touhou_kind']=='arrangement' for x in new)==350
          assert all(x['touhou_kind'] in {'arrangement','mixed'} for x in new)

          old=base[154426];cur=head[154426]
          assert cur['confidence']=='verified'
          assert cur['artist']=='beatMARIO' and cur['title']=='Night of Knights'
          assert cur['touhou_kind']=='arrangement'
          assert cur['origin_games']==ORIGIN_GAMES and cur['original_themes']==ORIGINAL_THEMES
          assert set(old['evidence'])<=set(cur['evidence'])
          for ev in ['audit:night-of-knights-2026-08','manual:verified','composition:cool-create:night-of-knights','corroboration:cool-create:base-track']:
              assert ev in cur['evidence'],(ev,cur['evidence'])
          assert 'manual:candidate' not in cur['evidence'] and 'manual:excluded' not in cur['evidence']
          assert head[1561908]['confidence']=='candidate' and 'manual:verified' not in head[1561908]['evidence']

          api=OsuApi.from_env();api.token()
          verify_ids=new_ids+[154426]
          def live(i):
              raw=api.beatmapset(i);assert int(raw['id'])==i
              c=head[i]
              modes=sorted({normalize_mode(b.get('mode','')) for b in raw.get('beatmaps',[]) if b.get('mode')})
              assert raw.get('artist','')==c['artist'],(i,'artist')
              assert raw.get('title','')==c['title'],(i,'title')
              assert raw.get('creator','')==c['creator'],(i,'creator')
              assert raw.get('source','')==c['source'],(i,'source',raw.get('source'),c['source'])
              assert raw.get('status','unknown')==c['status'],(i,'status')
              assert modes==c['modes'],(i,'modes',modes,c['modes'])
              return i
          with ThreadPoolExecutor(max_workers=8) as pool:
              verified=list(pool.map(live,verify_ids))
          assert len(verified)==358
          try:
              api.beatmapset(1561908)
          except HttpError as exc:
              assert 'HTTP 404' in str(exc),str(exc)
          else:
              raise AssertionError('1561908 unexpectedly resolves during final audit')

          doc=Path('docs/source-audit-2026-08-night-of-knights.md').read_text(encoding='utf-8')
          for needle in [
              'The three releases give **41 first-party source-backed works**',
              '**42 query/status pairs**',
              '**440 absent**',
              '**357',
              '**83',
              '**36 query/status pairs, zero guarded title+artist direct matches, and zero API query errors**',
              '`154426`',
              '`1561908`',
              'Structured provenance normalization',
          ]:assert needle in doc,needle
          Catalog.load(Path('data/catalog.json')).validate()
          print('NIGHT_FINAL_EXACT_AUDIT_OK')
          print('base_catalog=',len(base))
          print('head_catalog=',len(head))
          print('new_verified=',len(new_ids))
          print('old_upgrades=',changed_old)
          print('automatic=',auto,'manual=',manual)
          print('mixed=',sorted(MIXED_IDS),'arrangement=',350)
          print('unresolved_candidate=1561908')
          print('live_refetched=',len(verified))
          PY
          make check
          make build
