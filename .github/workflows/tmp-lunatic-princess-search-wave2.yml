name: Temporary Lunatic Princess search audit wave 2

on:
  pull_request:

permissions:
  contents: read

jobs:
  search-wave2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Search second-wave source-backed arrangement titles
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, unicodedata
          from collections import defaultdict, Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.osu_api import OsuApi, entry_from_osu

          CORPUS=[
            ('夜が動く','IOSYS'),('Eternal moon','Silver Forest'),('すごいえーりん・その1','COOL&CREATE'),('すごいえーりん・その2','COOL&CREATE'),
            ('あなたがここにいなくても','OTAKU-ELITE Recordings'),('千年幻想郷 ～ 竹取飛翔','Forest306'),('蓬莱の家庭教師','街角麻婆豆'),('Hazy Moon','Echoes Construction'),
            ('摂氏零℃がワタシの体温',"Pizuya's Cell"),('Furniture Store','surreacheese'),('邦楽合奏の為の「竹取飛翔 ～ Lunatic Princess」','外柿山'),
            ('EXTRA - Through the Looking glass ～ モウヒトリノ姫君','WAVE'),('月見草','WAVEDRIVE'),('俺的、サニーサイド ～某キャラ萌え的サウンド～','CTBR'),
            ('ニセモノノオツキサマ','Black Onyx'),('No return','CODE-49'),('Help me,ERINNNNN!! 締切 ver','COOL&CREATE'),('Resurrection','Croak Not Rue'),
            ('永夜 抄太(39)','FullMooN.13'),('極東アウトブレイク対策本部','Iemitsu.'),('タイクツ','Aria Rhythm'),('Happiness of pretense','FOX RAVEL×KINZOK ON'),
            ('Dream Fragment','FOX RAVEL×KINZOK ON'),('Take to Re:PS','Sound CYCLONE'),('竹取飛翔 ～ Help me, ERINNNNNN!!','TAMUSIC'),('quiet night','もぱた。'),
            ('La princesa lunática','CXR Record'),('笑体不明','DiGiTAL WiNG'),('Bamboo Princess','Login Records'),('Order To Thumbs Up','Rolling Contact'),
            ('竹取飛翔 ～ Lunatic Princess (Ryu☆Remix)','Ryu☆'),('月夜のレインドロップ',"Sister's Spread-i"),('Road to the sky',"Sister's Spread-i"),
            ('ライト、ムーンライト',"Sister's Spread-i"),('永月饗宴','THE SERGEANT'),('Secret Traveler','Adust Rain'),('Better bow than break','Baguettes Ensemble'),
            ('竹取ふらいとッ☆ to: Luna /from: our Tokyo','Iemitsu.'),('竹取TOKYO物語～Shibuya Street Princess','Iemitsu.'),('rotater','LOVEマシーン'),
            ('Lunatic Jump!','Shingo Dj'),('夢花火','Sun Flower Field'),('Flowing Destiny','魂音泉×Kissing the Mirror'),('Fullmoon Tonight','3S Cubic'),
            ('永遠亭','AQUA STYLE'),('Kill Myself','Bluetrain×GO-ZEN'),('YES！最高Princess☆','Innocent Key'),('The Moon sees us','LIMBO-54'),
            ('Hypnotic Waltz','M3tamix Records'),('Paladin','Music Advance'),('蒼天月下','R/K Project'),('Guilty Princess 2011 rearrange mix','Studio “Syrup Comfiture”'),
            ('其れは砌の物語','TAMUSIC'),('誘いの月輪','Tutti Sound'),('永遠亭組曲','Tutti Sound'),('Lunatic Princess -2011 Club Mix-','laughing out loud'),
            ('HARU NO KUDANZAKA','minimum electric design'),('Moonscraper','GET IN THE RING'),('HOPE','SNUG SPACE'),('竹取飛翔-Vocal-',"SYNC.ART'S"),
            ('慰めの永遠亭','ShibayanRecords'),('Day before going down','Spoo and Nick'),('daystar in the dark','ZYTOKINE'),('かぐやひめ','音召缶'),
            ('Moonlight','緋月ノ雫'),('永遠亭イントロ','かぷりこーん'),('ボス撃破','かぷりこーん'),('Guilty Princess','AniPix'),
            ('Hard work Princess','ジェリコの法則'),('竹取飛翔(drum step Remix)','D.I.C.S.'),('Colleen from the moon','Casket'),('竹通ル日昇','Azure Line'),
            ('RECOLLECT MOON(Special Inst. Version)','博麗神社社務所'),('ナヨタケノークライ','荒御霊'),('FeTiO3','荒御霊'),('闇月夜','=NeutraL='),
            ('Mysterium Vinyl','非可逆リズム'),('天涯蠱毒','GET IN THE RING×東方事変'),('Re:story','Freedom Phantasm'),('Lunatic Dance','Lunatic Gate'),
            ('竹取飛翔 -Lunatic Princess-(Ebon Remix)','Lunatic Gate'),('永','紺碧Studio'),('TAG FORCE','ガネメ'),('久遠の郷 ～ Farewell, Dear Moon','笹川家'),
            ('Never Die','ハコビバ'),('不滅の罪人','東方深晴霞'),('本当','雲あがり'),('かごめ','雲あがり')
          ]

          GENERIC={'No return','Resurrection','Dream Fragment','quiet night','Bamboo Princess','Order To Thumbs Up','Road to the sky','rotater','Moonlight','永','本当','かごめ','Never Die','HOPE','Paladin','Re:story','Lunatic Dance','Guilty Princess'}
          def norm(s):
              return ''.join(c for c in unicodedata.normalize('NFKC',s or '').casefold() if c.isalnum())
          def exact_title(actual, expected):
              return norm(actual)==norm(expected)
          def artist_ok(actual, guard):
              a,g=norm(actual),norm(guard)
              return bool(a and g and (a in g or g in a))

          api=OsuApi.from_env(); api.token()
          query_defs=[]; seen=set()
          for title,guard in CORPUS:
              q=f'{guard} {title}' if title in GENERIC else title
              if q not in seen:
                  seen.add(q); query_defs.append((q,title,guard))
              # For distinctive titles, an artist-qualified companion query catches search-ranking misses.
              if title not in GENERIC:
                  q2=f'{guard} {title}'
                  if q2 not in seen:
                      seen.add(q2); query_defs.append((q2,title,guard))

          discovered={}; qhits=defaultdict(set)
          def run_query(item):
              q,_,_=item
              return q, api.search(q,max_pages=3)
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures=[pool.submit(run_query,item) for item in query_defs]
              for f in as_completed(futures):
                  q,rows=f.result()
                  for raw in rows:
                      i=int(raw['id']); discovered[i]=raw; qhits[i].add(q)

          preliminary=[]
          for i,raw in discovered.items():
              matches=[(title,guard) for title,guard in CORPUS if exact_title(raw.get('title',''),title)]
              if matches:
                  preliminary.append((i,matches))

          def direct(item):
              i,_=item
              try:
                  raw=api.beatmapset(i)
              except Exception as exc:
                  return {'beatmapset_id':i,'error':f'{type(exc).__name__}:{exc}'}
              entry=entry_from_osu(raw,evidence=['audit:lunatic-princess-wave2'],confidence='candidate')
              matches=[]
              for title,guard in CORPUS:
                  if exact_title(entry.title,title):
                      matches.append({'title':title,'guard':guard,'artist_match':artist_ok(entry.artist,guard)})
              return {'beatmapset_id':i,'raw':raw,'entry':entry,'matches':matches}
          with ThreadPoolExecutor(max_workers=8) as pool:
              rows=list(pool.map(direct,preliminary))

          catalog=Catalog.load(Path('data/catalog.json'))
          coverage=Counter(); review=[]; errors=[]
          for row in rows:
              i=row['beatmapset_id']
              if 'error' in row:
                  errors.append(row); continue
              e=row['entry']; matches=row['matches']
              if not matches: continue
              cur=catalog.entries.get(i)
              if cur is None: state='absent'; coverage['absent']+=1
              elif cur.confidence in {'verified','probable'}: state=cur.confidence; coverage['already_accepted']+=1
              else: state=cur.confidence; coverage[f'existing_{state}']+=1
              if cur is not None and cur.confidence in {'verified','probable'}: continue
              review.append({
                  'beatmapset_id':i,'catalog_state':state,'artist':e.artist,'title':e.title,'creator':e.creator,
                  'source':e.source,'status':e.status,'modes':e.modes,'classifier_confidence':e.confidence,
                  'explicit_touhou_source':is_explicit_touhou_source(e.source),
                  'source_backed_artist_match':any(m['artist_match'] for m in matches),'matches':matches,'queries':sorted(qhits[i])
              })
          review.sort(key=lambda x:(not x['source_backed_artist_match'],x['beatmapset_id']))
          print('LUNATIC_WAVE2_REPORT_BEGIN')
          print(json.dumps({'corpus_tuples':len(CORPUS),'search_queries':len(query_defs),'search_discovered_unique':len(discovered),'exact_title_preliminary':len(preliminary),'coverage':dict(coverage),'errors':errors,'review_count':len(review),'source_backed_artist_matches':sum(x['source_backed_artist_match'] for x in review),'review':review},ensure_ascii=False,indent=2))
          print('LUNATIC_WAVE2_REPORT_END')
          PY
