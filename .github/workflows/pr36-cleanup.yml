name: PR36 cleanup temporary review workflows

on:
  push:
    branches:
      - feat/touhou-coverage-wave3-2026-09
    paths:
      - .github/workflows/pr36-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/touhou-coverage-wave3-2026-09
      - name: Remove all temporary PR36 workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=(.github/workflows/pr36-*.yml)
          if [[ ! -e "${files[0]}" ]]; then
            echo "No PR36 temporary workflows found"
            exit 1
          fi
          printf 'Removing temporary workflow: %s\n' "${files[@]}"
          git rm -- "${files[@]}"
          git commit -m "chore: remove temporary PR36 review workflows"
          git push origin HEAD:feat/touhou-coverage-wave3-2026-09
