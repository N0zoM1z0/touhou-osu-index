name: Temporary Moonlight existing coverage audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit-existing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare exact Moonlight mappool with catalog confidence
        env:
          OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
          OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import json,re
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          from io import BytesIO
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from zipfile import ZipFile
          from touhou_osu.catalog import Catalog
          from touhou_osu.classifier import is_explicit_touhou_source
          from touhou_osu.google_sheets import _DOCUMENT_REL_NS,_SPREADSHEET_NS,_normalize_archive_path,_relationship_targets,_shared_strings,_worksheet_texts,google_sheet_export_url
          from touhou_osu.http import request
          from touhou_osu.osu_api import OsuApi

          sid='1nqD85CClkgNIHxMU2KVGfcs2i5QphzIEupGxuiqlf04'; sheet_name='Маппул'
          payload=request(google_sheet_export_url(sid),headers={'Accept':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})
          ids=[]; seen=set()
          with ZipFile(BytesIO(payload)) as z:
            wb='xl/workbook.xml'; root=ET.fromstring(z.read(wb)); rels=_relationship_targets(z.read('xl/_rels/workbook.xml.rels')); shared=_shared_strings(z)
            for sh in root.findall(f'.//{{{_SPREADSHEET_NS}}}sheet'):
              if sh.attrib.get('name')!=sheet_name: continue
              p=_normalize_archive_path(wb,rels[sh.attrib[f'{{{_DOCUMENT_REL_NS}}}id']])
              for text in _worksheet_texts(z,p,shared):
                for m in re.finditer(r'https?://osu\.ppy\.sh/b/(\d+)',text,re.I):
                  i=int(m.group(1))
                  if i not in seen: seen.add(i); ids.append(i)
          api=OsuApi.from_env(); api.token()
          def resolve(i):
            try:
              raw=api.get(f'/beatmaps/{i}'); return (i,int(raw['beatmapset_id']),None)
            except Exception as exc: return (i,None,f'{type(exc).__name__}:{exc}')
          with ThreadPoolExecutor(max_workers=8) as p: rows=list(p.map(resolve,ids))
          cat=Catalog.load(Path('data/catalog.json'))
          existing=[]; missing=[]; unresolved=[]
          for bid,sid,error in rows:
            if error: unresolved.append({'beatmap_id':bid,'error':error}); continue
            if sid in cat.entries:
              e=cat.entries[sid]
              existing.append({'beatmap_id':bid,'beatmapset_id':sid,'confidence':e.confidence,'artist':e.artist,'title':e.title,'source':e.source,'evidence':e.evidence})
            else: missing.append((bid,sid))
          # Independently refetch missing current source so the 9 weak-metadata rows are exact.
          def missing_live(pair):
            bid,sid=pair; raw=api.beatmapset(sid)
            return {'beatmap_id':bid,'beatmapset_id':sid,'artist':raw.get('artist',''),'title':raw.get('title',''),'source':raw.get('source',''),'explicit_touhou_source':is_explicit_touhou_source(raw.get('source',''))}
          with ThreadPoolExecutor(max_workers=8) as p: ml=list(p.map(missing_live,missing))
          weak=[x for x in ml if not x['explicit_touhou_source']]
          print('MOONLIGHT_EXISTING_AUDIT_BEGIN')
          print(json.dumps({'mappool_ids':len(ids),'resolved':len(rows)-len(unresolved),'unresolved':unresolved,'existing':len(existing),'existing_confidence_counts':dict(Counter(x['confidence'] for x in existing)),'existing_nonaccepted':[x for x in existing if x['confidence'] not in {'verified','probable'}],'missing':len(ml),'missing_weak_metadata':weak},ensure_ascii=False,indent=2))
          print('MOONLIGHT_EXISTING_AUDIT_END')
          PY
